# TractorVS: updates are proposed as PRs and require human/CI review.
# Never auto-merge dependency updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
