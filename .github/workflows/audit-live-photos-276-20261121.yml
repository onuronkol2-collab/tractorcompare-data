name: TractorVS one-time live image copyright and resolution proof 276
on:
  push:
    branches: [audit/live-photos-276-20261121]
    paths: [".github/workflows/audit-live-photos-276-20261121.yml"]
permissions:
  contents: read
jobs:
  live_verification:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Verify 3 live model pages, credits, JPEGs and image sitemap
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const approved=JSON.parse(readFileSync("site/docs/photo-import-evidence-mccormick-20261121.json","utf8")).approved;
          if(approved.length!==3)throw Error("Three approved source records expected");
          const ids=new Map([
            ["McCormick|X4.080","d0c1306b"],["McCormick|X8.631 VT-Drive","95fdcc9a"],
            ["Belarus|952.3","be29821d"],
          ]);
          const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
            .toLowerCase().replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ş/g,"s")
            .replace(/ç/g,"c").replace(/ö/g,"o").replace(/ü/g,"u")
            .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
          const wait=ms=>new Promise(ok=>setTimeout(ok,ms));
          const fetchSite=async(url,method="GET")=>fetch(url,{method,
            signal:AbortSignal.timeout(18000),
            headers:{"User-Agent":"TractorVS/1.0 (readonly live gallery provenance audit)"}});
          let accepted=false;
          for(let attempt=1;attempt<=5;attempt++){
            let sitemap="";
            try{
              const m=await fetchSite("https://tractorvs.com/image-sitemap.xml");
              if(m.ok)sitemap=await m.text();
            }catch{}
            const tests=[];
            for(const photo of approved){
              const key=photo.brand+"|"+photo.model;
              const modelid=ids.get(key);
              if(!modelid)throw Error("Missing current published model identity "+key);
              const pageUrl="https://tractorvs.com/tr/tractors/"+
                slug(photo.brand+"-"+photo.model)+"-"+modelid+"/";
              const result={model:key,status:0,attribution:false,license:false,
                modelPhoto:false,sitemap:sitemap.includes(photo.fileId),sizes:{}};
              try{
                const page=await fetchSite(pageUrl);
                result.status=page.status;
                if(page.ok){
                  const html=await page.text();
                  result.modelPhoto=html.includes(photo.fileId);
                  result.attribution=html.includes(photo.photographer);
                  result.license=html.includes(photo.licenseUrl);
                }
                for(const size of [480,960,1920]){
                  const file="https://tractorvs.com/images/tractors/"+
                    photo.fileId+"-"+size+".jpg";
                  const res=await fetchSite(file,size===480?"GET":"HEAD");
                  const mime=res.headers.get("content-type")||"";
                  let signature=true;
                  if(size===480 && res.ok){
                    const bytes=new Uint8Array(await res.arrayBuffer());
                    signature=bytes.length>9000 && bytes[0]===255 &&
                      bytes[1]===216 && bytes[2]===255 &&
                      bytes.at(-2)===255 && bytes.at(-1)===217;
                  }
                  result.sizes[size]={status:res.status,mime,valid:res.status===200&&
                    mime.startsWith("image/jpeg")&&signature};
                }
              }catch(e){result.error=String(e).slice(0,140);}
              tests.push(result);
            }
            const passing=tests.filter(x=>x.status===200&&x.attribution&&x.license&&
              x.modelPhoto&&x.sitemap&&[480,960,1920].every(size=>x.sizes[size]?.valid));
            console.log("PHOTO_276_LIVE "+JSON.stringify({attempt,passing:passing.length,total:tests.length,tests}));
            if(passing.length===3){accepted=true;break;}
            if(attempt<5)await wait(20000);
          }
          if(!accepted)throw Error("Photo release not yet proved live; did not claim success");
          console.log("PHOTO_276_LIVE_VERIFIED all three pages, licensing, sizes, sitemap");
          NODE
