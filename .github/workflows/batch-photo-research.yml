name: TractorVS batch photo research
on:
  workflow_dispatch:
  # Daily at 07:15 Europe/Istanbul (04:15 UTC): historical + all public models.
  schedule:
    - cron: "15 4 * * *"
  # Runs once after this schedule change is merged; CI checks PRs separately.
  push:
    branches: [main]
    paths:
      - ".github/workflows/batch-photo-research.yml"
  pull_request:
    paths:
      - ".github/workflows/batch-photo-research.yml"
      - "site/scripts/batch-photo-discovery.mjs"
      - "site/scripts/photo-sitemap-fetch.mjs"
      - "site/scripts/photo-source-response.mjs"
      - "site/scripts/photo-private-inventory.mjs"
      - "site/scripts/photo-research-quality-gate.mjs"
      - "site/scripts/extract-archived-tractor-inventory.py"
      - "site/scripts/archive-brand-photo-discovery.mjs"
      - "site/scripts/photo-model-identity.mjs"
      - "site/scripts/photo-license-check.mjs"
      - "site/scripts/photo-model-aliases.mjs"
      - "site/tests/photo-*.test.mjs"
permissions:
  contents: read

concurrency:
  # Pull-request tests must not queue behind the long daily live research.
  # Main pushes, schedules and manual runs remain in one research lane.
  group: ${{ github.event_name == 'pull_request' && github.ref || 'production' }}-tractorvs-photo
  cancel-in-progress: false

jobs:
  validate_photo_research:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Validate model identity and image license checks without downloading all photos
        run: node --test site/tests/photo-*.test.mjs
  research_all_models:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Export only model identities from historical tractor archive
        run: python site/scripts/extract-archived-tractor-inventory.py
      # Both searches always run independently; neither failure is hidden by
      # continue-on-error because the final quality gate checks both outcomes.
      - name: Search licensed image candidates for ALL archived brands and models
        id: archive
        continue-on-error: true
        run: node site/scripts/archive-brand-photo-discovery.mjs
      - name: Independently recheck all CURRENT published model pages
        id: published
        continue-on-error: true
        run: node site/scripts/batch-photo-discovery.mjs
      - name: Archive copyright and identity research without publishing drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-all-model-photo-research
          path: photo-discovery-report
          retention-days: 30
      - name: Fail closed unless both stages and research report are complete
        if: always()
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          PUBLISHED_OUTCOME: ${{ steps.published.outcome }}
        run: |
          echo "Archive research outcome: $ARCHIVE_OUTCOME"
          echo "Published model research outcome: $PUBLISHED_OUTCOME"
          node site/scripts/photo-research-quality-gate.mjs
          test "$ARCHIVE_OUTCOME" = "success"
          test "$PUBLISHED_OUTCOME" = "success"
