name: TractorVS batch photo research
on:
  workflow_dispatch:
  # Daily 07:15 Europe/Istanbul: one shared Commons brand discovery for historical + all live models.
  schedule:
    - cron: "15 4 * * *"
  # Runs once after this schedule change is merged; CI checks PRs separately.
  push:
    branches: [main]
    paths:
      - ".github/workflows/batch-photo-research.yml"
  pull_request:
    paths:
      - ".github/workflows/batch-photo-research.yml"
      - "site/scripts/batch-photo-discovery.mjs"
      - "site/scripts/photo-sitemap-fetch.mjs"
      - "site/scripts/photo-source-response.mjs"
      - "site/scripts/photo-private-inventory.mjs"
      - "site/scripts/photo-archive-candidate-index.mjs"
      - "site/scripts/photo-commons-http.mjs"
      - "site/scripts/photo-research-model-union.mjs"
      - "site/scripts/photo-research-quality-gate.mjs"
      - "site/scripts/photo-exact-coverage-gate.mjs"
      - "site/scripts/extract-archived-tractor-inventory.py"
      - "site/scripts/archive-brand-photo-discovery.mjs"
      - "site/scripts/photo-model-identity.mjs"
      - "site/scripts/photo-license-check.mjs"
      - "site/scripts/photo-openverse-independent-batch.mjs"
      - "site/scripts/photo-model-aliases.mjs"
      - "site/tests/photo-*.test.mjs"
      - "site/tests/fixtures/photo-offline-fetch.mjs"
permissions:
  contents: read

concurrency:
  # Pull-request tests must not queue behind the long daily live research.
  # Main pushes, schedules and manual runs remain in one research lane.
  group: ${{ github.event_name == 'pull_request' && github.ref || 'tractorvs-all-model-photo-research' }}
  cancel-in-progress: false

jobs:
  validate_photo_research:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Validate model identity and image license checks without downloading all photos
        run: node --test site/tests/photo-*.test.mjs
  research_all_models:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Export only model identities from historical tractor archive
        run: python site/scripts/extract-archived-tractor-inventory.py
      # Acquire live public model identities ONCE. The next step combines this
      # inventory with archival models in brand-batched Commons queries.
      - name: Snapshot public published model identity from live sitemap
        id: inventory
        continue-on-error: true
        run: node site/scripts/batch-photo-discovery.mjs --inventory-only
      # Preserve the archives and stage outcomes even when a source fails.
      # The final quality gate must still fail on any incomplete research.
      - name: Search licensed candidates for archived AND current models by brand
        id: archive
        continue-on-error: true
        run: node site/scripts/archive-brand-photo-discovery.mjs
      - name: Cross-check ALL published models against same-run Commons brand evidence
        id: published
        continue-on-error: true
        run: node site/scripts/batch-photo-discovery.mjs
      # Second independent index, distinct from Wikimedia Commons. No rights
      # promotion: Openverse metadata remains a private editorial lead only.
      # This phase has a 12-request/day cap and a hard stop on 429. Its own
      # report records partial errors without ever changing Commons QA gates.
      - name: Discover independent Flickr and Europeana CC candidates via Openverse (no publishing)
        id: openverse
        if: steps.inventory.outcome == 'success'
        continue-on-error: true
        run: node --experimental-strip-types site/scripts/photo-openverse-independent-batch.mjs
      - name: Archive copyright and identity research without publishing drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-all-model-photo-research
          path: photo-discovery-report
          retention-days: 30
      - name: Fail closed unless both stages and research report are complete
        if: always()
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          PUBLISHED_OUTCOME: ${{ steps.published.outcome }}
        run: |
          echo "Live inventory outcome: $INVENTORY_OUTCOME"
          echo "Archive research outcome: $ARCHIVE_OUTCOME"
          echo "Published model research outcome: $PUBLISHED_OUTCOME"
          node site/scripts/photo-research-quality-gate.mjs
          test "$INVENTORY_OUTCOME" = "success"
          test "$ARCHIVE_OUTCOME" = "success"
          test "$PUBLISHED_OUTCOME" = "success"
