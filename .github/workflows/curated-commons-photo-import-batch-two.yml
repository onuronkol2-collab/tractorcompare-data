name: Curated Commons photo import - Belarus batch two (candidate only)
on:
  push:
    branches:
      - photos/belarus-451-572-9234-licensed-20261122
    paths:
      - ".github/workflows/curated-commons-photo-import-batch-two.yml"
      - "site/scripts/import-curated-commons-photos-batch-two.mjs"
      - "site/docs/photo-evidence-belarus-451-572-9234-20261122.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tractorvs-curated-belarus-photo-import-batch-two
  cancel-in-progress: false
jobs:
  import_source_licensed_JPEGs:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/photos/belarus-451-572-9234-licensed-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Verify three exact Commons File titles, copyright, CC BY-SA license, and all first-party JPEGs
        run: node site/scripts/import-curated-commons-photos-batch-two.mjs
      - name: Commit only licensed binaries and signed-off measured SHA-256 ledger to candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/images/tractors site/docs/photo-evidence-belarus-451-572-9234-20261122.json
          if git diff --cached --quiet; then
            echo "No candidate JPEG or proof changes"
          else
            git commit -m "Stage exact Belarus 451, 572 and 923.4 licensed JPEG sizes and SHA-256 evidence"
            git push origin HEAD:photos/belarus-451-572-9234-licensed-20261122
          fi
