name: Targeted public forum translation delivery verification
on:
  pull_request:
    paths:
      - '.github/workflows/forum-10-locale-delivery-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect ten public pages and XML
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, xml.etree.ElementTree as ET, json, sys
          from html.parser import HTMLParser
          origin = "https://tractorvs.com"
          slug = "traktor-markalari-hangi-ulkenin-dunya-traktor-markalari-ve-uretim-yerleri-2026-b11d1ad6f0cc4a18ab839d18ccc2f7ea"
          locales = ["en","tr","de","es","fr","pt-br","hi","ru","ja","zh"]
          urls = {l:origin+("" if l=="en" else "/"+l)+"/forum/"+slug+"/" for l in locales}
          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"TractorVS-public-release-audit/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=18) as res:
                  return res.status,res.geturl(),res.headers.get_content_type(),res.read(4000000).decode("utf-8")
          class Parse(HTMLParser):
              def __init__(self):
                  super().__init__(); self.lang=""; self.canonical=[]; self.alts={}; self.robots=[]; self.h1=[]; self.in_h1=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="html": self.lang=a.get("lang","")
                  if tag=="link":
                      if a.get("rel")=="canonical": self.canonical.append(a.get("href"))
                      if a.get("rel")=="alternate" and "hreflang" in a: self.alts[a["hreflang"].lower()]=a.get("href")
                  if tag=="meta" and a.get("name","").lower()=="robots": self.robots.append(a.get("content","").lower())
                  if tag=="h1": self.in_h1=True
              def handle_endtag(self,tag):
                  if tag=="h1": self.in_h1=False
              def handle_data(self,data):
                  if self.in_h1: self.h1.append(data)
          titles={"en":"Tractor brand origins","tr":"Traktör Markaları Hangi Ülkenin","de":"Woher kommen Traktormarken","es":"De qué país son las marcas","fr":"De quels pays viennent les marques","pt-br":"De que país são as marcas","hi":"ट्रैक्टर ब्रांड किस देश के हैं","ru":"Из каких стран происходят марки","ja":"トラクターブランドの発祥国","zh":"拖拉机品牌来自哪个国家"}
          try:
              status,final,ct,xml=fetch(origin+"/forum-sitemap.xml")
              root=ET.fromstring(xml)
              locs={x.text for x in root.findall(".//{*}loc")}
              print("SITEMAP",json.dumps({"http":status,"type":ct,"matched":sum(u in locs for u in urls.values()),"expected":10}),flush=True)
          except Exception as e:
              print("SITEMAP ERROR",str(e),flush=True);locs=set()
          def check(l):
              u=urls[l]
              try:
                  status,final,ct,html=fetch(u);p=Parse();p.feed(html)
                  # The title should identify the exact article, not merely a generic forum page.
                  title=" ".join(p.h1)
                  result={"locale":l,"http":status,"final_url":final==u,"html":ct=="text/html","lang":p.lang.lower().split("-")[0]==l.split("-")[0],"canonical":p.canonical==[u],"indexable":any("index" in x and "noindex" not in x for x in p.robots) and not any("noindex" in x for x in p.robots),"title":titles[l].casefold() in title.casefold(),"hreflang":sum(p.alts.get(k)==v for k,v in urls.items()),"sitemap":u in locs}
                  result["pass"]=all(result[k] for k in ("final_url","html","lang","canonical","indexable","title","sitemap")) and status==200 and result["hreflang"]==10
                  return result
              except Exception as e: return {"locale":l,"pass":False,"error":str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              rows=list(pool.map(check,locales))
          for row in rows: print("PAGE",json.dumps(row,ensure_ascii=False),flush=True)
          print("TOTAL",sum(x["pass"] for x in rows),"/",len(rows),flush=True)
          sys.exit(0 if all(x["pass"] for x in rows) else 1)
          PY
