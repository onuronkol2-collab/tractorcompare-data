name: TractorVS Golden Rule integrity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-policy:
    name: Verify AGENTS and agent instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify permanent agent policy files and references
        run: node scripts/verify-golden-rule.mjs

      - name: Verify safe forum RLS policy consolidation (offline, no database writes)
        run: node --test scripts/forum-rls-policy-performance.test.mjs

      - name: Verify CodeQL incident recovery policy (offline, no retries or writes)
        run: node --test scripts/codeql-recovery.test.mjs
