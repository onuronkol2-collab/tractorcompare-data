name: TractorVS Image SEO live audit
on:
  pull_request:
    paths:
      - ".github/workflows/image-seo-live-audit.yml"
      - "site/scripts/image-seo-live-audit.mjs"
      - "site/scripts/image-copyright-live-cases.mjs"
      - "site/scripts/image-seo-asset-boundaries.mjs"
      - "site/scripts/image-seo-http.mjs"
      - "site/scripts/production-sitemap-inventory.mjs"
      - "site/tests/image-seo-live-audit.test.mjs"
      - "site/src/lib/tractor-photos.ts"
      - "site/src/lib/historical-licensed-photos.ts"
      - "site/src/lib/model-seo.ts"
      - "site/scripts/photo-copyright-source-proof.mjs"
      - "site/scripts/photo-copyright-candidate-audit.mjs"
      - "site/scripts/image-license-jsonld-check.mjs"
      - "site/tests/photo-copyright-source-proof.test.mjs"
      - "site/tests/image-license-jsonld-check.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/image-seo-live-audit.yml"
      - "site/scripts/image-seo-live-audit.mjs"
      - "site/scripts/image-copyright-live-cases.mjs"
      - "site/scripts/image-seo-asset-boundaries.mjs"
      - "site/scripts/image-seo-http.mjs"
      - "site/scripts/production-sitemap-inventory.mjs"
      - "site/tests/image-seo-live-audit.test.mjs"
      - "site/src/lib/tractor-photos.ts"
      - "site/src/lib/historical-licensed-photos.ts"
      - "site/src/lib/model-seo.ts"
      - "site/scripts/photo-copyright-source-proof.mjs"
      - "site/scripts/photo-copyright-candidate-audit.mjs"
      - "site/scripts/image-license-jsonld-check.mjs"
      - "site/tests/photo-copyright-source-proof.test.mjs"
      - "site/tests/image-license-jsonld-check.test.mjs"
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"
permissions:
  contents: read
jobs:
  image_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Test bounded image retries and moderated forum media URL boundaries (offline)
        run: node --test site/tests/image-seo-live-audit.test.mjs
      - name: Regression test source-specific copyright proofs (no network)
        run: node --experimental-strip-types --test site/tests/photo-copyright-source-proof.test.mjs site/tests/image-license-jsonld-check.test.mjs
      - name: Read-only Commons audit of remaining Search Console copyright examples
        run: node --experimental-strip-types site/scripts/photo-copyright-candidate-audit.mjs
      - name: Confirm Wikimedia uploader asserted Own work AND self-issued license for each emitted copyrightNotice
        run: node --experimental-strip-types site/scripts/photo-copyright-source-proof.mjs
      - name: Verify first party public JPEGs, photo attribution and image sitemap
        run: node site/scripts/image-seo-live-audit.mjs
