name: TractorVS live website SEO smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/live-website-audit.yml"
      - "site/scripts/live-website-audit.mjs"
      - "site/scripts/production-seo-audit.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-website-audit.yml"
      - "site/scripts/live-website-audit.mjs"
  workflow_dispatch:
  # Every Monday 09:00 Europe/Istanbul (06:00 UTC): public SEO regression check.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Inspect workers.dev preview
        env:
          TRACTORVS_AUDIT_ORIGIN: https://tractorvs-site.onuronkol2.workers.dev
        run: node site/scripts/live-website-audit.mjs
      - name: Inspect tractorvs.com custom domain
        env:
          TRACTORVS_AUDIT_ORIGIN: https://tractorvs.com
        run: node site/scripts/live-website-audit.mjs
      - name: Check full production sitemap, model SEO and all 10 languages
        run: node site/scripts/production-seo-audit.mjs
