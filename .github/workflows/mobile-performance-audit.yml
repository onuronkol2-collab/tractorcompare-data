name: TractorVS mobile performance baseline

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-performance-audit.yml"
      - "site/scripts/mobile-lighthouse-summary.mjs"
      - "site/tests/mobile-lighthouse-summary.test.mjs"
  workflow_dispatch:
  # Free weekly mobile baseline, Monday 07:37 Europe/Istanbul (04:37 UTC).
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  mobile_lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check Chrome and Node
        run: |
          node --version
          command -v google-chrome || command -v chromium || true
      - name: Test mobile Lighthouse summary parsing and field/ lab transparency
        run: node --test site/tests/mobile-lighthouse-summary.test.mjs
      - name: Measure representative Turkish pages with mobile Lighthouse
        run: |
          set -euo pipefail
          mkdir -p /tmp/tractorvs-lighthouse
          for route in home catalog model compare; do
            case "$route" in
              home) url="https://tractorvs.com/tr/" ;;
              catalog) url="https://tractorvs.com/tr/tractors/" ;;
              model) url="https://tractorvs.com/tr/tractors/belarus-80-1-ca3d18f9/" ;;
              compare) url="https://tractorvs.com/tr/compare/" ;;
            esac
            echo "Auditing $route $url"
            npx --yes lighthouse@12.8.2 "$url" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --emulated-form-factor=mobile \
              --throttling-method=simulate \
              --output=json --output-path="/tmp/tractorvs-lighthouse/$route.json" \
              --quiet
          done
          node site/scripts/mobile-lighthouse-summary.mjs

      - name: Upload diagnostic Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-mobile-lighthouse
          path: /tmp/tractorvs-lighthouse/*.json
          retention-days: 7
