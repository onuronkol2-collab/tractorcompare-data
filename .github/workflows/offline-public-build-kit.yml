name: Offline public build kit (isolated QA)
on:
  push:
    branches: [qa/offline-public-build-kit-20261126]
    paths: [".github/workflows/offline-public-build-kit.yml"]
permissions:
  contents: read
concurrency:
  group: offline-public-build-kit
  cancel-in-progress: true
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "6f7d5c06140ebcdbb8f79a4eac989830ecc8f614"
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Package public source and locked dependencies only
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f7d5c06140ebcdbb8f79a4eac989830ecc8f614"
          stage="$RUNNER_TEMP/offline-kit"
          parts="$RUNNER_TEMP/offline-parts"
          mkdir -p "$stage/repo" "$stage/node" "$parts"
          git archive HEAD | tar -xf - -C "$stage/repo"
          cd "$stage/repo"
          npm ci --no-audit --no-fund
          node --version
          npm --version
          nodehome="$(dirname "$(dirname "$(command -v node)")")"
          cp -a "$nodehome/bin" "$nodehome/lib" "$stage/node/"
          test -x "$stage/node/bin/node"
          test -e "$stage/repo/node_modules/astro"
          printf '%s\n' "6f7d5c06140ebcdbb8f79a4eac989830ecc8f614" > "$stage/SOURCE_SHA"
          (cd "$stage/repo" && sha256sum package-lock.json) > "$stage/LOCKFILE_SHA256"
          tar -C "$stage" -czf "$RUNNER_TEMP/offline.tar.gz" SOURCE_SHA LOCKFILE_SHA256 repo node
          test "$(stat -c %s "$RUNNER_TEMP/offline.tar.gz")" -le 268435456
          cd "$parts"
          sha256sum ../offline.tar.gz | sed 's|../offline.tar.gz|offline.tar.gz|' > SHA256SUM
          split -b 32M -d -a 2 ../offline.tar.gz part-
          sha256sum part-* > PARTS_SHA256
          echo "parts=$(find . -maxdepth 1 -name 'part-*' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-manifest
          path: |
            ${{ runner.temp }}/offline-parts/SHA256SUM
            ${{ runner.temp }}/offline-parts/PARTS_SHA256
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 00
        if: fromJSON(steps.pack.outputs.parts) > 0
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-00
          path: ${{ runner.temp }}/offline-parts/part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 01
        if: fromJSON(steps.pack.outputs.parts) > 1
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-01
          path: ${{ runner.temp }}/offline-parts/part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 02
        if: fromJSON(steps.pack.outputs.parts) > 2
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-02
          path: ${{ runner.temp }}/offline-parts/part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 03
        if: fromJSON(steps.pack.outputs.parts) > 3
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-03
          path: ${{ runner.temp }}/offline-parts/part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 04
        if: fromJSON(steps.pack.outputs.parts) > 4
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-04
          path: ${{ runner.temp }}/offline-parts/part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 05
        if: fromJSON(steps.pack.outputs.parts) > 5
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-05
          path: ${{ runner.temp }}/offline-parts/part-05
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 06
        if: fromJSON(steps.pack.outputs.parts) > 6
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-06
          path: ${{ runner.temp }}/offline-parts/part-06
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 07
        if: fromJSON(steps.pack.outputs.parts) > 7
        uses: actions/upload-artifact@v7
        with:
          name: offline-kit-07
          path: ${{ runner.temp }}/offline-parts/part-07
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
