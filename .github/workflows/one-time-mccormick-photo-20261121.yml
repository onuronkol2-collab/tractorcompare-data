name: TractorVS one-time strict model-licensed Commons image acquisition
on:
  push:
    branches: [feat/photos-mccormick-belarus-20261121]
    paths:
      - ".github/workflows/one-time-mccormick-photo-20261121.yml"
      - ".github/scripts/one-time-verify-mccormick-images.mjs"
permissions:
  contents: write
concurrency:
  group: tractorvs-licensed-mccormick-batch-20261121
  cancel-in-progress: false
jobs:
  verify_commons_images:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/feat/photos-mccormick-belarus-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Exact model, creator, CC license and JPEG bytes verification
        run: node .github/scripts/one-time-verify-mccormick-images.mjs
      - name: Commit only evidence and reviewed image assets on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/images/tractors site/docs/photo-import-evidence-mccormick-20261121.json
          if git diff --cached --quiet; then
            echo "::error::No approved images to commit"
            exit 1
          fi
          git commit -m "assets(photos): independently checked Commons JPG derivatives"
          git push origin HEAD:refs/heads/feat/photos-mccormick-belarus-20261121
