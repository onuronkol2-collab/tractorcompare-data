name: TractorVS one-time Steyr photo source validation
on:
  push:
    branches: [feat/steyr-4085-6240-6340-photos-20261121]
    paths:
      - ".github/workflows/one-time-steyr-photo-20261121.yml"
      - ".github/scripts/one-time-steyr-photo-review-20261121.mjs"
permissions:
  contents: write
concurrency:
  group: tractorvs-once-steyr-photo-review
  cancel-in-progress: false
jobs:
  verify_source:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/feat/steyr-4085-6240-6340-photos-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Check exact Commons source, license and real JPEG image
        run: node .github/scripts/one-time-steyr-photo-review-20261121.mjs
      - name: Commit only reviewed images and provenance to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/images/tractors site/docs/steyr-photo-source-audit-20261121.json
          if git diff --cached --quiet; then
            echo "::error::Missing verified JPEGs"
            exit 1
          fi
          git commit -m "assets(photos): validated Steyr Wikimedia JPEG derivatives"
          git push origin HEAD:refs/heads/feat/steyr-4085-6240-6340-photos-20261121
