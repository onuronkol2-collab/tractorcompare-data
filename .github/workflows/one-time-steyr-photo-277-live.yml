name: TractorVS Steyr photo #277 live release check (one time)
on:
  push:
    branches: [audit/steyr-photo-277-live-20261121]
    paths: [".github/workflows/one-time-steyr-photo-277-live.yml"]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Confirm live model page, licenses, thumbnail, full gallery and image sitemap
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const approved=JSON.parse(readFileSync("site/docs/steyr-photo-source-audit-20261121.json","utf8")).approved;
          const slug=new Map([["4085 KOMPAKT","steyr-4085-kompakt-c6318a52"],["6340 TERRUS CVT","steyr-6340-terrus-cvt-0d6c0ec1"]]);
          if(approved.length!==2)throw Error("Unexpected photo release size");
          const wait=ms=>new Promise(ok=>setTimeout(ok,ms));
          let allPassed=false;
          for(let attempt=1;attempt<=6;attempt++){
            let xml="";
            try{const r=await fetch("https://tractorvs.com/image-sitemap.xml",{signal:AbortSignal.timeout(18000)});
              if(r.ok)xml=await r.text();}catch{}
            const results=[];
            for(const p of approved){
              const pageUrl="https://tractorvs.com/tr/tractors/"+slug.get(p.model)+"/";
              const x={model:p.model,page:0,source:false,license:false,author:false,sitemap:xml.includes(p.fileId),images:{}};
              try{
                const page=await fetch(pageUrl,{signal:AbortSignal.timeout(18000)});
                x.page=page.status;
                if(page.ok){const body=await page.text();
                  x.source=body.includes(p.fileId);
                  x.author=body.includes(p.photographer);
                  x.license=body.includes(p.licenseUrl);}
                for(const size of [480,960,1920]){
                  const r=await fetch("https://tractorvs.com/images/tractors/"+p.fileId+"-"+size+".jpg",
                    {method:size===480?"GET":"HEAD",signal:AbortSignal.timeout(18000)});
                  const mime=r.headers.get("content-type")||"";
                  let jpeg=true;
                  if(size===480&&r.ok){const b=new Uint8Array(await r.arrayBuffer());
                    jpeg=b.length>9000&&b[0]===255&&b[1]===216&&b[2]===255&&b.at(-2)===255&&b.at(-1)===217;}
                  x.images[size]={status:r.status,mime,ok:r.status===200&&mime.startsWith("image/jpeg")&&jpeg};
                }
              }catch(e){x.error=String(e).slice(0,200)}
              results.push(x);
            }
            const passes=results.filter(x=>x.page===200&&x.source&&x.license&&x.author&&x.sitemap&&
              [480,960,1920].every(s=>x.images[s]?.ok));
            console.log("STEYR_277_LIVE "+JSON.stringify({attempt,passed:passes.length,total:2,results}));
            if(passes.length===2){allPassed=true;break}
            if(attempt<6)await wait(20000);
          }
          if(!allPassed)throw Error("Live deployment not yet validated. Main branch merge alone is not publication.");
          console.log("STEYR_277_LIVE_VERIFIED page, licence, photographer, 480/960/1920 and sitemap 2/2");
          NODE
