name: Temporary licensed photo binary proof (Q225 and Forterra HD)
on:
  push:
    branches: ["audit/variant-photo-research-20261123"]
    paths:
      - ".github/workflows/oneoff-reviewed-photo-import-20261123.yml"
permissions:
  contents: write
concurrency:
  group: "tractorvs-oneoff-review-only-photo-import-20261123"
  cancel-in-progress: false
jobs:
  download_and_commit_to_draft_branch_only:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check current branch and immutable source identities
        run: |
          test "$GITHUB_REF" = "refs/heads/audit/variant-photo-research-20261123"
          test "$GITHUB_REPOSITORY" = "onuronkol2-collab/tractorcompare-data"
      - name: Fetch 6 JPG derivatives strictly from reviewed Commons origins, verify size MIME and SHA
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request, urllib.parse
          root=pathlib.Path("site/public/images/tractors")
          root.mkdir(parents=True,exist_ok=True)
          items=[
           dict(fileId="valtra-q225-bene-riobo-2024",commonsPath="6/6e/Valtra_Q225.jpg",
                width=4650,height=3100,brand="Valtra",model="Q225",
                sourcePage="https://commons.wikimedia.org/wiki/File:Valtra_Q225.jpg",
                photographer="Bene Riobó",license="CC BY-SA 4.0",
                tractorId="96623863-6825-429e-88b0-805923de69b8"),
           dict(fileId="zetor-forterra-140-hd-maindistorsion-2022",commonsPath="0/05/Zetor_Forterra_140_HD.jpg",
                width=1296,height=1122,brand="Zetor",model="FORTERRA 140",
                sourcePage="https://commons.wikimedia.org/wiki/File:Zetor_Forterra_140_HD.jpg",
                photographer="Maindistorsion",license="CC BY-SA 4.0",
                tractorId="0a900d97-3df4-444b-a25d-2c9885683b99")
          ]
          def size_jpeg(data):
            if not(data[:2]==b'\xff\xd8' and data[-2:]==b'\xff\xd9'):
              raise RuntimeError("JPEG magic invalid")
            i=2
            while i<len(data)-9:
              if data[i]!=255:
                i+=1; continue
              while i<len(data) and data[i]==255: i+=1
              if i>=len(data): break
              marker=data[i]; i+=1
              if marker in (0xd8,0xd9,0x01) or 0xd0<=marker<=0xd7: continue
              if i+2>len(data): break
              length=int.from_bytes(data[i:i+2],"big")
              if length<2 or i+length>len(data): break
              if marker in (0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf):
                return int.from_bytes(data[i+5:i+7],"big"),int.from_bytes(data[i+3:i+5],"big")
              i+=length
            raise RuntimeError("JPEG dimension marker absent")
          downloaded=[];report=[]
          try:
            for item in items:
              fname=item["commonsPath"].split("/")[-1]
              original="https://upload.wikimedia.org/wikipedia/commons/"+item["commonsPath"]
              proof={"fileId":item["fileId"],"brand":item["brand"],"model":item["model"],
                     "tractorId":item["tractorId"],"sourcePage":item["sourcePage"],
                     "originFullUrl":original,"photographer":item["photographer"],
                     "license":item["license"],
                     "licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/",
                     "sourceWidth":item["width"],"sourceHeight":item["height"],
                     "configurationExact":False,"derivatives":{}}
              for label,target_width in ((480,500),(960,960),(1920,1920)):
                if target_width >= item["width"]:
                  url=original
                  expected=item["width"]
                else:
                  url="https://upload.wikimedia.org/wikipedia/commons/thumb/"+item["commonsPath"]+"/"+str(target_width)+"px-"+fname
                  expected=target_width
                request=urllib.request.Request(url,headers={"User-Agent":"TractorVS-PhotoEvidence/1.0 (tractorvs.com; checked CC attribution)","Accept":"image/jpeg"})
                with urllib.request.urlopen(request,timeout=35) as response:
                  if response.status!=200 or not response.headers.get("Content-Type","").lower().startswith("image/jpeg"):
                    raise RuntimeError("Untrusted HTTP/MIME "+item["fileId"]+" "+str(label))
                  if urllib.parse.urlparse(response.url).hostname!="upload.wikimedia.org":
                    raise RuntimeError("Unexpected redirect host")
                  blob=response.read(8_000_001)
                if not 9000<len(blob)<=8_000_000:
                  raise RuntimeError("Unexpected JPEG bytes for "+item["fileId"]+"/"+str(label))
                w,h=size_jpeg(blob)
                if w!=expected or h<150:
                  raise RuntimeError("Unexpected dimensions "+item["fileId"]+"/"+str(label)+" "+str((w,h)))
                name=item["fileId"]+"-"+str(label)+".jpg"
                path=root/name
                if path.exists():
                  raise RuntimeError("Refuse overwrite of preexisting photo "+name)
                path.write_bytes(blob)
                downloaded.append(path)
                digest=hashlib.sha256(blob).hexdigest()
                proof["derivatives"][str(label)]={"path":"site/public/images/tractors/"+name,
                     "sourceUrl":url,"width":w,"height":h,"bytes":len(blob),"sha256":digest}
                print("VERIFIED_JPEG",name,len(blob),w,h,digest,flush=True)
                time.sleep(1.0)
              report.append(proof)
            evidence=pathlib.Path("site/docs/photo-import-proof-valtra-q225-zetor-hd-20261123.json")
            if evidence.exists(): raise RuntimeError("Evidence path already exists")
            evidence.write_text(json.dumps({"status":"verified-binary-not-published","source":"Wikimedia Commons File pages reviewed independently by project editor",
                         "newImages":report},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
            print("TRACTORVS_PHOTO_BINARY_PROOF_OK models=2 images=6 no_deploy=true",flush=True)
          except Exception:
            for p in downloaded:
              p.unlink(missing_ok=True)
            raise
          PY
      - name: Commit verified JPEGs and hashes to isolated draft branch (no main and no deploy)
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/audit/variant-photo-research-20261123"
          git config user.name "tractorvs-photo-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/images/tractors/valtra-q225-bene-riobo-2024-480.jpg
          git add site/public/images/tractors/valtra-q225-bene-riobo-2024-960.jpg
          git add site/public/images/tractors/valtra-q225-bene-riobo-2024-1920.jpg
          git add site/public/images/tractors/zetor-forterra-140-hd-maindistorsion-2022-480.jpg
          git add site/public/images/tractors/zetor-forterra-140-hd-maindistorsion-2022-960.jpg
          git add site/public/images/tractors/zetor-forterra-140-hd-maindistorsion-2022-1920.jpg
          git add site/docs/photo-import-proof-valtra-q225-zetor-hd-20261123.json
          git commit -m "assets(photos): verify two CC BY-SA sources and hash six JPEGs [isolated PR only]"
          git push origin "HEAD:refs/heads/audit/variant-photo-research-20261123"
