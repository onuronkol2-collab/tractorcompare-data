name: TractorVS one-time licensed photo 960px repair staging
on:
  push:
    branches: ["photos/fix-live-960-502-20261123"]
    paths:
      - ".github/workflows/photo-960-repair-stage-20261123.yml"
      - "site/scripts/stage-photo-960-repair-20261123.py"
permissions:
  contents: write
concurrency:
  group: tractorvs-photo-960-repair-stage-20261123
  cancel-in-progress: false
jobs:
  stage_two_existing_photos:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/photos/fix-live-960-502-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned decoder for offline color-identity proof
        run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Source-identity and script syntax gate
        run: |
          python -m py_compile site/scripts/stage-photo-960-repair-20261123.py
          python - <<'PY'
          from pathlib import Path
          s=Path('site/scripts/stage-photo-960-repair-20261123.py').read_text()
          assert s.count('"fileId": ') == 2
          assert s.count('"license": "CC BY-SA 4.0"') == 2
          assert 'valtra-t255-622d182c' in s
          assert 'versatile-nemesis-255-be32337e' in s
          assert 'source.resize(source_480.size' in s
          PY
      - name: Download only two existing approved 1920 JPEGs and derive missing checked-in sizes
        run: python site/scripts/stage-photo-960-repair-20261123.py
      - name: Independently validate two identities, original 480 files, and four new JPEG SHA-256 proofs
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('site/public/images/tractors')
          proof=json.loads(Path('site/docs/photo-960-1920-repair-evidence-20261123.json').read_text())
          expected={'valtra-t255-622d182c':'Bene Riobó','versatile-nemesis-255-be32337e':'MarcelX42'}
          assert proof['reviewRequired'] is True and proof['approvedToPublish'] is False
          assert proof['publicationCount'] == 0
          assert {p['fileId'] for p in proof['images']} == set(expected)
          for p in proof['images']:
            assert p['author']==expected[p['fileId']] and p['license']=='CC BY-SA 4.0'
            assert p['sourcePage'].startswith('https://commons.wikimedia.org/wiki/File:')
            assert p['sourceRoute']=='https://tractorvs.com/images/tractors/'+p['fileId']+'-1920.jpg'
            assert max(p['meanRgbDifferenceAgainstExisting480']) < 20
            old=p['existing480']
            assert hashlib.sha256((root / old['file']).read_bytes()).hexdigest()==old['sha256']
            assert {v['width'] for v in p['newFiles']}=={960,1920}
            for v in p['newFiles']:
              file=root/v['file']
              raw=file.read_bytes()
              assert len(raw)==v['bytes'] and hashlib.sha256(raw).hexdigest()==v['sha256']
              assert raw[:3]==bytes.fromhex('ffd8ff') and raw[-2:]==bytes.fromhex('ffd9')
              with Image.open(file) as decoded:
                decoded.load()
                assert decoded.format=='JPEG' and (decoded.width,decoded.height)==(v['width'],v['height'])
          print('TWO_EXISTING_CC_BY_SA_PHOTOS_FOUR_SIZES_VERIFIED_IN_REVIEW_BRANCH')
          PY
      - name: Preserve QA evidence as review-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-960-repair-reviewed-photos
          path: |
            site/docs/photo-960-1920-repair-evidence-20261123.json
            site/public/images/tractors/valtra-t255-622d182c-960.jpg
            site/public/images/tractors/valtra-t255-622d182c-1920.jpg
            site/public/images/tractors/versatile-nemesis-255-be32337e-960.jpg
            site/public/images/tractors/versatile-nemesis-255-be32337e-1920.jpg
          if-no-files-found: error
          retention-days: 14
      - name: Commit only four evidence-gated derivatives in this nonproduction review branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "photos/fix-live-960-502-20261123"
          for id in valtra-t255-622d182c versatile-nemesis-255-be32337e; do
            for size in 960 1920; do
              git add "site/public/images/tractors/${id}-${size}.jpg"
            done
          done
          git add site/docs/photo-960-1920-repair-evidence-20261123.json
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "fix(photo): stage SHA-verified local 960 and 1920 JPEGs for two existing licensed photos"
          git push origin HEAD:refs/heads/photos/fix-live-960-502-20261123
          echo "Files staged in a review branch only. No merge, publish, or remote database change."
