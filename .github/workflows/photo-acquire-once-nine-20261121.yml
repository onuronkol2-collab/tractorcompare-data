name: TractorVS one-time nine exact Commons photo validation
on:
  push:
    branches: [feat/photo-batch-nine-verified-20261121]
    paths:
      - ".github/workflows/photo-acquire-once-nine-20261121.yml"
      - ".github/scripts/one-time-commons-nine-photo-review-20261121.mjs"
permissions:
  contents: write
concurrency:
  group: tractorvs-one-time-exact-photos-nine
  cancel-in-progress: false
jobs:
  validate_and_commit:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/feat/photo-batch-nine-verified-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Match exact tractor identity, photo author and CC license; verify JPEG
        run: node .github/scripts/one-time-commons-nine-photo-review-20261121.mjs
      - name: Commit verified JPEGs and audit evidence only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/images/tractors/ site/docs/photo-review-evidence-20261121.json
          if git diff --cached --quiet; then
            echo "::error::No newly verified thumbnails to commit"
            exit 1
          fi
          git commit -m "assets(photos): strict source-verified Wikimedia thumbnails"
          git push origin HEAD:refs/heads/feat/photo-batch-nine-verified-20261121
