name: TractorVS photo batch evidence and file transfer (review only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/photo-batch-evidence-transfer-20261124.yml'
      - 'site/scripts/photo-batch-evidence-transfer-20261124.mjs'
permissions:
  contents: read
  actions: read
jobs:
  recover_mf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tractorvs-curated-source-review-20261124
          run-id: 45422737022
          github-token: ${{ github.token }}
          path: recovered
      - name: Validate and encode only the reviewed public CC BY-SA MF original
        run: |
          python - <<'PY'
          import pathlib, hashlib, base64, json
          from PIL import Image
          files=list(pathlib.Path('recovered').rglob('candidate-4.jpg'))
          assert len(files)==1
          raw=files[0].read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='1020fab948f7505de2899160ea819cd7f11793bfe653cc5132ab5683bce95180'
          im=Image.open(files[0]); im.load(); assert im.format=='JPEG' and im.size==(2996,2247)
          for w in [480,960,1920]:
              p=pathlib.Path(f'mf-4708-platform-pere-igor-2016-{w}.jpg')
              im.resize((w,w*3//4),Image.Resampling.LANCZOS).convert('RGB').save(p,'JPEG',quality=85,optimize=True)
              b=p.read_bytes()
              with Image.open(p) as check: check.load(); assert check.size==(w,w*3//4)
              chunks=[base64.b64encode(b).decode()[i:i+12000] for i in range(0,len(base64.b64encode(b)),12000)]
              print('PUBLIC_PHOTO_META '+json.dumps({'file':p.name,'width':w,'height':w*3//4,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'chunks':len(chunks)}))
              for i,c in enumerate(chunks): print(f'PUBLIC_PHOTO_CHUNK {p.name} {i} {c}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: mf-4708-reviewed-transfer
          path: mf-4708-platform-pere-igor-2016-*.jpg
          retention-days: 7
  collect_new:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node site/scripts/photo-batch-evidence-transfer-20261124.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tractorvs-photo-batch-evidence-20261124
          path: photo-batch-evidence
          retention-days: 14
