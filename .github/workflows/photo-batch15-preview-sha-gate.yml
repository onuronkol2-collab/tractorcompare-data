name: TractorVS fifteen CC photo WebP/JPEG preview SHA/rights release gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/public/images/tractors/*-720.jpg"
      - "site/public/images/tractors/*-720.webp"
      - "site/docs/photo-mobile-batch15-evidence.json"
      - "site/src/lib/approved-mobile-photo-assets.mjs"
      - "site/tests/photo-mobile-batch15-local.test.mjs"
      - "site/scripts/verify-photo-batch15-preview.mjs"
      - ".github/workflows/photo-batch15-preview-sha-gate.yml"
permissions:
  contents: read
concurrency:
  group: tractorvs-batch15-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-exact-assets:
    name: 30 actual image bytes + source license + real preview HTTP proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Validate 15 exact rights/sha files and preview proof tests without network
        run: |
          node --experimental-strip-types --test \
            site/tests/photo-mobile-batch15-local.test.mjs \
            site/tests/photo-mobile-batch15-preview.test.mjs
      - name: Require all 30 real Cloudflare preview image SHA/bytes/MIME
        run: node site/scripts/verify-photo-batch15-preview.mjs
