name: TractorVS fifteen CC photo WebP/JPEG preview SHA/rights release gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/public/images/tractors/*-720.jpg"
      - "site/public/images/tractors/*-720.webp"
      - "site/docs/photo-mobile-batch15-evidence.json"
      - "site/src/lib/approved-mobile-photo-assets.mjs"
      - "site/tests/photo-mobile-batch15-local.test.mjs"
      - "site/scripts/verify-photo-batch15-preview.mjs"
      - "site/scripts/exact-photo-preview-proof.mjs"
      - "site/scripts/verify-mobile-preview-assets.mjs"
      - "site/scripts/workers-build-readiness.mjs"
      - "site/tests/exact-photo-preview-proof.test.mjs"
      - ".github/workflows/photo-batch15-preview-sha-gate.yml"
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: tractorvs-batch15-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-exact-assets:
    name: 30 actual image bytes + source license + real preview HTTP proof
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Validate 15 exact rights/sha files and preview proof tests without network
        run: |
          node --experimental-strip-types --test \
            site/tests/photo-mobile-batch15-local.test.mjs \
            site/tests/photo-mobile-batch15-preview.test.mjs
      - name: Require all 30 real Cloudflare preview image SHA/bytes/MIME
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$PREVIEW_HEAD_SHA"
          node --test site/tests/exact-photo-preview-proof.test.mjs
          node site/scripts/verify-photo-batch15-preview.mjs
