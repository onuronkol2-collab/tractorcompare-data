name: TractorVS 15-photo production WebP/JPEG copyright and SHA proof
on:
  push:
    branches: [main]
    paths:
      - "site/public/images/tractors/*-720.jpg"
      - "site/public/images/tractors/*-720.webp"
      - "site/src/lib/approved-mobile-photo-assets.mjs"
      - "site/scripts/verify-photo-batch15-production.mjs"
      - ".github/workflows/photo-batch15-production-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tractorvs-batch15-production-readonly
  cancel-in-progress: true
jobs:
  verify-live:
    name: Real 30 images + 15 canonical CC model pages + 6 held 404 (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Test strict production proof against synthetic legal and malicious responses
        run: node --experimental-strip-types --test site/tests/photo-mobile-batch15-production-proof.test.mjs
      - name: Require live target or verified main descendant before content assertions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/live-release-readiness.mjs "$GITHUB_SHA"
      - name: Verify true Cloudflare production 30 SHA, 15 public CC pages and 3 held models
        run: node --experimental-strip-types site/scripts/verify-photo-batch15-production.mjs
