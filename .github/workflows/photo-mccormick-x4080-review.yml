name: TractorVS McCormick X4.080 Commons JPEG review staging
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/photo-mccormick-x4080-review.yml"
      - "site/scripts/photo-stage-mccormick-x4080-20261123.py"
      - "site/scripts/stage-reviewed-commons-20261122.py"
      - "site/docs/photo-mccormick-x4080-review-20261123.json"
permissions:
  contents: write
jobs:
  stage_unpublished_x4080:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source identity and Python syntax without network
        run: |
          python -m py_compile site/scripts/stage-reviewed-commons-20261122.py site/scripts/photo-stage-mccormick-x4080-20261123.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("site/docs/photo-mccormick-x4080-review-20261123.json").read_text())
          assert data["reviewOnly"] is True and data["publicationCount"] == 0
          assert data["target"]["tractorId"] == "d0c1306b-f178-4c6e-8c2f-945e645fee79"
          assert data["source"]["fileId"] == "mccormick-x4-080-mbone-agritechnica-2023"
          assert data["source"]["ownWorkDeclared"] is True
          assert data["source"]["licenseName"] == "CC BY-SA 4.0"
          assert data["source"]["visualModelBadgeConfirmed"] is True
          assert data["alreadyPublishedModelHasPhoto"] is True
          assert data["newModelCoverage"] == 0
          assert not data["allowAutomaticApproval"]
          print("TRACTORVS_EXACT_X4080_SOURCE_REVIEW_ONLY")
          PY
      - name: Install pinned JPEG decoder
        run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Acquire one source JPEG without retries and stage exactly three derived JPEGs
        run: python site/scripts/photo-stage-mccormick-x4080-20261123.py --output-dir ./photo-x4080-review
      - name: Verify three actual JPEGs, MIME by Pillow, file dimensions and SHA-256
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          root=Path("photo-x4080-review")
          info=json.loads((root/"sha256-ledger.json").read_text())
          assert info["reviewRequired"] is True and info["publicationCount"] == 0
          assert len(info["images"]) == 1
          record=info["images"][0]
          assert record["fileId"] == "mccormick-x4-080-mbone-agritechnica-2023"
          assert record["approvedToPublish"] is False
          assert record["photographer"] == "MB-one"
          assert record["license"] == "CC BY-SA 4.0"
          assert record["sourcePage"].startswith("https://commons.wikimedia.org/wiki/File:")
          assert record["origin"].startswith("https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/")
          assert len(record["originSha256"]) == 64
          assert {x["width"] for x in record["derivatives"]} == {480,960,1920}
          for item in record["derivatives"]:
            p=root/item["file"]
            assert p.name == record["fileId"]+"-"+str(item["width"])+".jpg"
            raw=p.read_bytes()
            assert len(raw) == item["bytes"]
            assert hashlib.sha256(raw).hexdigest() == item["sha256"]
            assert raw[:3] == bytes.fromhex("ffd8ff") and raw[-2:] == bytes.fromhex("ffd9")
            with Image.open(p) as photo:
              photo.load()
              assert photo.format == "JPEG"
              assert photo.width == item["width"] and photo.height == item["height"]
          print("TRACTORVS_X4080_THREE_REAL_JPEGS_REVIEW_REQUIRED")
          PY
      - name: Upload unapproved images and evidence for manual review only
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-mccormick-x4080-licensed-review-only
          path: photo-x4080-review/
          if-no-files-found: error
          retention-days: 30
      - name: Attach only two missing high-resolution JPEGs and one ledger to the exact PR branch, never main
        if: github.event.pull_request.number == 506 && github.event.pull_request.head.repo.full_name == github.repository
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH="photo/20261123-mccormick-x4080-review"
          test "${{ github.event.pull_request.head.ref }}" = "$BRANCH"
          git fetch --no-tags origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          observed="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          if [[ "$observed" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Review branch advanced; refusing a stale automated photo commit."
            exit 1
          fi
          git switch -c photo-verified-assets "refs/remotes/origin/${BRANCH}"
          id="mccormick-x4-080-mbone-agritechnica-2023"
          mkdir -p site/public/images/tractors site/docs
          test -f "site/public/images/tractors/${id}-480.jpg"
          test -f "site/public/images/tractors/${id}-720.webp"
          for size in 960 1920; do
            target="site/public/images/tractors/${id}-${size}.jpg"
            if [[ -e "$target" ]]; then
              echo "::error::Photo file already exists; refusing overwrite."
              exit 1
            fi
            install -m 0644 "photo-x4080-review/${id}-${size}.jpg" "$target"
            git add "$target"
          done
          evidence="site/docs/photo-import-evidence-mccormick-x4080-20261123.json"
          if [[ -e "$evidence" ]]; then
            echo "::error::Release ledger already exists; refusing overwrite."
            exit 1
          fi
          install -m 0644 photo-x4080-review/sha256-ledger.json "$evidence"
          git add "$evidence"
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "feat(photo): attach SHA-verified McCormick X4.080 JPEGs to draft PR"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "Only the two missing high-resolution JPEG derivatives attached to draft PR #506; existing 480px JPEG and current live catalog untouched."
