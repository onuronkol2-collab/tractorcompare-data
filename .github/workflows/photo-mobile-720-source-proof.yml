name: TractorVS three-image 720px Commons source proof
on:
  pull_request:
    paths:
      - "site/src/lib/tractor-photos.ts"
      - "site/src/components/TractorPhoto.astro"
      - "site/worker/index.js"
      - "site/scripts/photo-mobile-720-source-proof.mjs"
      - "site/tests/photo-mobile-720-source-proof.test.mjs"
      - ".github/workflows/photo-mobile-720-source-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photo-720-commons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: Verify exactly three Commons 720px JPEGs (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Offline fail-closed source guard regressions
        run: node --experimental-strip-types --test site/tests/photo-mobile-720-source-proof.test.mjs
      - name: HTTP JPEG source proof (three bounded GETs, no Wikimedia API)
        run: node --experimental-strip-types site/scripts/photo-mobile-720-source-proof.mjs
