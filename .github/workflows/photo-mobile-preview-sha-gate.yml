name: TractorVS exact six 720px WebP and JPEG preview proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/public/images/tractors/*-720.jpg"
      - "site/public/images/tractors/*-720.webp"
      - "site/src/components/TractorPhoto.astro"
      - "site/src/lib/approved-mobile-photo-assets.mjs"
      - "site/worker/index.js"
      - "site/scripts/verify-mobile-preview-assets.mjs"
      - "site/scripts/workers-build-readiness.mjs"
      - "site/tests/workers-build-readiness.test.mjs"
      - "site/tests/photo-mobile-preview.test.mjs"
      - "site/docs/photo-mobile-720-artifact-evidence.json"
      - ".github/workflows/photo-mobile-preview-sha-gate.yml"
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: tractorvs-720-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-asset-preview:
    name: Verify real Cloudflare preview WebP/JPEG bytes and SHA (no deploy)
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Offline byte and source safety tests
        run: |
          node --experimental-strip-types --test \
            site/tests/photo-mobile-local-assets.test.mjs \
            site/tests/photo-mobile-preview.test.mjs \
            site/tests/workers-build-readiness.test.mjs
      - name: Check exactly three 720px WebP + three JPEG on deployed Cloudflare preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_HEAD_BRANCH: ${{ github.head_ref }}
        run: node site/scripts/verify-mobile-preview-assets.mjs
