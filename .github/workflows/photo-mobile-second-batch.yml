name: TractorVS second-batch 18 licensed mobile photo offline QA (no deploy)
on:
  pull_request:
    paths:
      - "site/scripts/photo-mobile-second-batch.mjs"
      - "site/scripts/photo-mobile-second-batch.py"
      - "site/tests/photo-mobile-second-batch.test.mjs"
      - ".github/workflows/photo-mobile-second-batch.yml"
permissions:
  contents: read
concurrency:
  group: tractorvs-batch18-photo-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  batch-review:
    name: 18 existing licensed photos — verify, resize, report, never publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only open-source pinned local decoder
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Verify 18 rights-reviewed source identities and no publishing permissions
        run: node --experimental-strip-types --test site/tests/photo-mobile-second-batch.test.mjs
      - name: Generate explicit hard-pinned 18-photo read-only manifest
        run: |
          mkdir -p /tmp/tractorvs-batch18
          node --experimental-strip-types site/scripts/photo-mobile-second-batch.mjs /tmp/tractorvs-batch18/input.json
      - name: Generate and quality-check 720px JPEG/WebP offline derivatives from only first-party 960px
        run: |
          python site/scripts/photo-mobile-second-batch.py \
            --input /tmp/tractorvs-batch18/input.json \
            --out /tmp/tractorvs-batch18/output
      - name: Retain success and exact per-image failure evidence, never deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-batch18-photo-720-offline-QA-evidence
          path: /tmp/tractorvs-batch18/output/
          retention-days: 5
          if-no-files-found: warn
