name: TractorVS third-wave 24 JPEG WebP Cloudflare preview checksum gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/public/images/tractors/*-720.jpg"
      - "site/public/images/tractors/*-720.webp"
      - "site/src/lib/approved-mobile-photo-assets.mjs"
      - "site/scripts/verify-third-wave-preview-assets.mjs"
      - "site/scripts/exact-photo-preview-proof.mjs"
      - "site/scripts/verify-mobile-preview-assets.mjs"
      - "site/scripts/workers-build-readiness.mjs"
      - "site/tests/exact-photo-preview-proof.test.mjs"
      - "site/tests/photo-mobile-third-wave-preview.test.mjs"
      - "site/docs/photo-mobile-third-wave-assets-evidence.json"
      - ".github/workflows/photo-mobile-third-wave-preview.yml"
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: tractorvs-third-wave-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify exact 24 real preview image MIME/bytes/SHA — no deploy
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Validate all source rights, existing 18 photo compatibility, 24 exact binaries
        run: |
          node --experimental-strip-types --test \
            site/tests/photo-mobile-third-wave-assets.test.mjs \
            site/tests/photo-mobile-third-wave-preview.test.mjs
      - name: Verify all 24 exact static JPEG/WebP asset bytes on Cloudflare preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$PREVIEW_HEAD_SHA"
          node --test site/tests/exact-photo-preview-proof.test.mjs
          node site/scripts/verify-third-wave-preview-assets.mjs
