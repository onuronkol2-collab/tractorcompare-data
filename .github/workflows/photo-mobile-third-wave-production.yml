name: TractorVS third-wave 24-image live CC copyright and SHA release proof
on:
  push:
    branches: [main]
    paths:
      - "site/public/images/tractors/*-720.jpg"
      - "site/public/images/tractors/*-720.webp"
      - "site/src/lib/approved-mobile-photo-assets.mjs"
      - "site/scripts/verify-third-wave-production.mjs"
      - ".github/workflows/photo-mobile-third-wave-production.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tractorvs-third-wave-production-readonly
  cancel-in-progress: true
jobs:
  verify:
    name: Real 24 SHA photos + all published CC model pages + six held 404
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Test release proof against forged MIME/rights and held-photo leaks
        run: node --experimental-strip-types --test site/tests/photo-mobile-third-wave-production.test.mjs
      - name: Require live target or verified main descendant before content assertions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/live-release-readiness.mjs "$GITHUB_SHA"
      - name: Verify actual production JPEG/WebP SHA plus canonical model copyright
        run: node --experimental-strip-types site/scripts/verify-third-wave-production.mjs
