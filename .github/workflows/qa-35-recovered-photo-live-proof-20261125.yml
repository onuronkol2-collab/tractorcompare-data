name: TractorVS 35 recovered photographs live proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-35-recovered-photo-live-proof-20261125.yml']
permissions:
  contents: read
  checks: read
jobs:
  live:
    if: github.head_ref == 'qa/35-recovered-photo-live-proof-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Require real deployed target or verified main descendant
        id: readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_REQUIRE_WORKERS_BUILD: "true"
        run: node site/scripts/live-release-readiness.mjs 535281ad635331fa4bff0524b1f65d81e0ede30b / /tr/
      - name: Verify all 230 locale pages and 105 JPEGs with attribution and exact byte hashes
        env:
          RELEASE_SHA: ${{ steps.readiness.outputs.release_sha }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, re, threading, urllib.request, urllib.error
          from pathlib import Path
          from html.parser import HTMLParser
          origin="https://tractorvs.com"
          release=os.environ["RELEASE_SHA"]
          assert re.fullmatch(r"[a-f0-9]{40}",release)
          locales=["en","tr","zh","hi","pt-br","fr","de","ru","ja","es"]
          evidence=json.loads(Path("site/docs/photo-evidence-recovered-bulk-20261125.json").read_text())
          routes={"30986b41-b486-41d6-815d-6bec72cd5bf1":"mccormick-x7-624-vt-drive-30986b41","191d10b4-86f6-43a5-b929-6e6e3c63ac9d":"fendt-724-vario-191d10b4","5c3743cd-1e32-4a22-8109-f2d4afdd1929":"valtra-q305-5c3743cd","1f000c28-7b5c-4372-9e3e-259f33a1809b":"valtra-f105-1f000c28","d0c1306b-f178-4c6e-8c2f-945e645fee79":"mccormick-x4-080-d0c1306b","95fdcc9a-c5c0-4329-a20e-3658c997e1ca":"mccormick-x8-631-vt-drive-95fdcc9a","caa65b80-800a-4bb7-be35-6de62ce318b2":"valtra-n175-caa65b80","9ffacba1-4442-4114-acac-e142e102af10":"tafe-7515-9ffacba1","66469e4d-896c-4d5f-9ca9-3335c6d7eb3a":"valtra-s416-66469e4d","e48a7f20-5b47-4ed0-a3f6-fec831e591a0":"valtra-n135-e48a7f20","7999a853-ec41-4c44-9f1d-2fa326713a81":"lindner-lintrac-160-ldrive-7999a853","1a85eb12-2fe9-45b4-93b0-8cb858249aed":"valtra-g135-1a85eb12","2e38e400-bfd5-4e45-aec1-03c9473d9458":"valtra-q245-2e38e400","e715524e-589a-438f-926c-02b626f21684":"zetor-proxima-e715524e","352f7575-b0be-429a-a92f-a0016b0090f2":"tafe-7515-cab-352f7575","f13464ba-0a65-4652-9229-2101e412376d":"valtra-t235-f13464ba","9a8bdada-0a7c-4a19-a5df-dc56ff9c159e":"versatile-295-9a8bdada","cbdfd364-e6a9-4323-ac6d-72010165d9a0":"versatile-620dt-cbdfd364","9016d690-fb3c-485f-9446-a9d5fb588a1c":"versatile-nemesis-175-9016d690","259a5389-2bf4-4a25-97a6-01fe6484843e":"versatile-460-259a5389","6850ed5b-2bb6-4790-96dd-d3945c4fffc2":"versatile-nemesis-255-6850ed5b","c22f3e9d-9662-4b2c-b978-4beff4d9288d":"valtra-t255-c22f3e9d","cf11aa07-2ab8-4924-9753-4574818e56d1":"zetor-proxima-cf11aa07"}
          assert len(evidence)==35 and len(routes)==23 and {e["tractorId"] for e in evidence}==set(routes)
          assert len({e["originalSha256"] for e in evidence})==35
          cooldown=threading.Event()
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canon=[];self.sha=[];self.sources=[];self.licenses=[];self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="link" and "canonical" in a.get("rel","").lower().split():self.canon.append(a.get("href"))
                  if tag=="meta" and a.get("name")=="tractorvs-release-sha":self.sha.append(a.get("content"))
                  if "data-photo-source" in a:self.sources.append(a["data-photo-source"])
                  if "data-photo-license" in a:self.licenses.append(a["data-photo-license"])
                  if tag=="img":self.images.append(a)
          def fetch(path):
              if cooldown.is_set():raise ValueError("Provider cooldown; request not made")
              url=origin+path
              req=urllib.request.Request(url,headers={"User-Agent":"TractorVS release verification (read-only; GitHub Actions)","Accept-Encoding":"identity","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      if r.headers.get("Retry-After"):cooldown.set();raise ValueError("Retry-After; halt")
                      if r.status!=200 or r.geturl()!=url:raise ValueError("unexpected HTTP status or redirect")
                      data=r.read(12000001)
                      if len(data)>12000000:raise ValueError("response too large")
                      return data,r.headers.get_content_type()
              except urllib.error.HTTPError as e:
                  if e.code==429 or e.headers.get("Retry-After"):cooldown.set()
                  raise
          def model(item):
              lang,uuid=item
              path=("" if lang=="en" else "/"+lang)+"/tractors/"+routes[uuid]+"/"
              data,mime=fetch(path);p=Page();p.feed(data.decode("utf-8"))
              assert mime=="text/html" and p.canon==[origin+path] and p.sha==[release], "page or release mismatch: "+path
              for e in evidence:
                  if e["tractorId"]!=uuid:continue
                  assert any(e["fileId"] in str(x) for x in p.images), "missing image: "+e["fileId"]
                  assert e["sourcePage"] in p.sources and e["licenseUrl"] in p.licenses, "missing attribution: "+e["fileId"]
              return {"group":"model","path":path}
          def image(d):
              path="/images/tractors/"+d["file"];data,mime=fetch(path)
              assert mime=="image/jpeg" and data.startswith(b"\xff\xd8"), "JPEG MIME/signature"
              assert len(data)==d["bytes"] and hashlib.sha256(data).hexdigest()==d["sha256"], "bytes/hash"
              return {"group":"jpeg","path":path}
          def run(item):
              fn,arg=item
              try:return {"ok":True,**fn(arg)}
              except Exception as e:return {"ok":False,"group":fn.__name__,"item":str(arg)[:220],"error":str(e)}
          work=[(model,(lang,uuid)) for lang in locales for uuid in routes]+[(image,d) for e in evidence for d in e["derivatives"]]
          assert len(work)==335
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(run,work))
          last=run((model,("en",next(iter(routes)))))
          for row in results+[last]:
              if not row["ok"]:print("PHOTO_RELEASE_ERROR",json.dumps(row),flush=True)
          ok=all(x["ok"] for x in results+[last])
          print("PHOTO_RELEASE_LIVE_RESULT",json.dumps({"release":release,"checked":len(results),"passed":sum(x["ok"] for x in results),"finalReleaseCheck":last["ok"],"newUniquePhotos":35 if ok else 0,"firstPhotoUUIDs":0}),flush=True)
          assert ok
          PY
