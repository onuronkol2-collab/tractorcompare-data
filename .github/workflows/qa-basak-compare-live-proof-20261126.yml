name: TractorVS Basak photographs and comparison release proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-basak-compare-live-proof-20261126.yml']
permissions:
  contents: read
  checks: read
jobs:
  live:
    if: github.head_ref == 'qa/basak-compare-live-proof-20261126' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Require real deployed target or verified main descendant
        id: readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_REQUIRE_WORKERS_BUILD: "true"
        run: node site/scripts/live-release-readiness.mjs ac912ca8737502a78ce8c0af1388a15955cde67d /compare/ /tractors/basak-traktor-5075-compact-20e382ea/ /tr/compare/ /tr/tractors/basak-traktor-5075-compact-20e382ea/ /zh/compare/ /zh/tractors/basak-traktor-5075-compact-20e382ea/ /hi/compare/ /hi/tractors/basak-traktor-5075-compact-20e382ea/ /pt-br/compare/ /pt-br/tractors/basak-traktor-5075-compact-20e382ea/ /fr/compare/ /fr/tractors/basak-traktor-5075-compact-20e382ea/ /de/compare/ /de/tractors/basak-traktor-5075-compact-20e382ea/ /ru/compare/ /ru/tractors/basak-traktor-5075-compact-20e382ea/ /ja/compare/ /ja/tractors/basak-traktor-5075-compact-20e382ea/ /es/compare/ /es/tractors/basak-traktor-5075-compact-20e382ea/
      - name: Verify 10 localized photo pages, nine JPEGs and ten comparison pages
        env:
          RELEASE_SHA: ${{ steps.readiness.outputs.release_sha }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, re, threading, urllib.request, urllib.error
          from pathlib import Path
          from html.parser import HTMLParser
          origin="https://tractorvs.com"
          release=os.environ["RELEASE_SHA"]
          assert re.fullmatch(r"[a-f0-9]{40}",release)
          locales=["en","tr","zh","hi","pt-br","fr","de","ru","ja","es"]
          evidence=json.loads(Path("site/docs/photo-evidence-basak-5075-20261125.json").read_text())
          routes={"20e382ea-5464-4128-a15a-b7bc304ef01f":"basak-traktor-5075-compact-20e382ea"}
          assert len(evidence)==3 and len(routes)==1 and {e["tractorId"] for e in evidence}==set(routes)
          assert len({e["originalSha256"] for e in evidence})==3 and len({e["fileId"] for e in evidence})==3
          cooldown=threading.Event()
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canon=[];self.sha=[];self.sources=[];self.licenses=[];self.images=[];self.ids=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get("id"):self.ids.add(a["id"])
                  if tag=="link" and "canonical" in a.get("rel","").lower().split():self.canon.append(a.get("href"))
                  if tag=="meta" and a.get("name")=="tractorvs-release-sha":self.sha.append(a.get("content"))
                  if "data-photo-source" in a:self.sources.append(a["data-photo-source"])
                  if "data-photo-license" in a:self.licenses.append(a["data-photo-license"])
                  if tag=="img":self.images.append(a)
          def fetch(path):
              if cooldown.is_set():raise ValueError("Provider cooldown; request not made")
              url=origin+path
              req=urllib.request.Request(url,headers={"User-Agent":"TractorVS release verification (read-only; GitHub Actions)","Accept-Encoding":"identity","Cache-Control":"no-cache"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      if r.headers.get("Retry-After"):cooldown.set();raise ValueError("Retry-After; halt")
                      if r.status!=200 or r.geturl()!=url:raise ValueError("unexpected HTTP status or redirect")
                      data=r.read(12000001)
                      if len(data)>12000000:raise ValueError("response too large")
                      return data,r.headers.get_content_type()
              except urllib.error.HTTPError as e:
                  if e.code==429 or e.headers.get("Retry-After"):cooldown.set()
                  raise
          def model(item):
              lang,uuid=item
              path=("" if lang=="en" else "/"+lang)+"/tractors/"+routes[uuid]+"/"
              data,mime=fetch(path);p=Page();p.feed(data.decode("utf-8"))
              assert mime=="text/html" and p.canon==[origin+path] and p.sha==[release], f"photo page mismatch: {path}; MIME={mime}; canonical={p.canon}; expected={release}; served={p.sha}"
              for e in evidence:
                  if e["tractorId"]!=uuid:continue
                  assert any(e["fileId"] in str(x) for x in p.images), "missing image: "+e["fileId"]
                  assert e["sourcePage"] in p.sources and e["licenseUrl"] in p.licenses, "missing attribution: "+e["fileId"]
              return {"group":"model","path":path}
          def compare(lang):
              path=("" if lang=="en" else "/"+lang)+"/compare/"
              data,mime=fetch(path);p=Page();p.feed(data.decode("utf-8"))
              assert mime=="text/html" and p.canon==[origin+path] and p.sha==[release], f"comparison mismatch: {path}; MIME={mime}; canonical={p.canon}; expected={release}; served={p.sha}"
              assert {"tc-share","tc-share-url","tc-share-status","tc-print","tc-rows"}.issubset(p.ids), "missing comparison controls"
              return {"group":"comparison-markup","path":path}
          def image(d):
              path="/images/tractors/"+d["file"];data,mime=fetch(path)
              assert mime=="image/jpeg" and data.startswith(b"\xff\xd8"), "JPEG MIME/signature"
              assert len(data)==d["bytes"] and hashlib.sha256(data).hexdigest()==d["sha256"], "bytes/hash"
              return {"group":"jpeg","path":path}
          def run(item):
              fn,arg=item
              try:return {"ok":True,**fn(arg)}
              except Exception as e:return {"ok":False,"group":fn.__name__,"item":str(arg)[:220],"error":str(e)}
          work=[(model,(lang,uuid)) for lang in locales for uuid in routes]+[(image,d) for e in evidence for d in e["derivatives"]]+[(compare,lang) for lang in locales]
          assert len(work)==29
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(run,work))
          last=run((compare,"en"))
          for row in results+[last]:
              if not row["ok"]:print("PHOTO_RELEASE_ERROR",json.dumps(row),flush=True)
          ok=all(x["ok"] for x in results+[last])
          print("PHOTO_RELEASE_LIVE_RESULT",json.dumps({"release":release,"checked":len(results),"passed":sum(x["ok"] for x in results),"finalReleaseCheck":last["ok"],"newUniquePhotos":3 if ok else 0,"firstPhotoUUIDs":1 if ok else 0,"comparisonMarkupLocales":sum(x["ok"] and x.get("group")=="comparison-markup" for x in results)}),flush=True)
          assert ok
          PY
