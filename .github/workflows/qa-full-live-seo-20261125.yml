name: QA only - current full live SEO and discovery proof
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qa-full-live-seo-20261125.yml"
permissions:
  contents: read
jobs:
  full-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Run existing full canonical live audit
        env:
          TRACTORVS_SEO_AUDIT_MODE: full
          TRACTORVS_SEO_EVIDENCE_PATH: ${{ runner.temp }}/tractorvs-full-seo.json
        run: |
          set -o pipefail
          node site/scripts/production-seo-audit.mjs 2>&1 | tee "$RUNNER_TEMP/tractorvs-full-seo.log"
      - name: Report brand incoming anchors and exact guide inventory
        if: always()
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          base="https://tractorvs.com"
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          def fetch(url):
              assert urlsplit(url).netloc=="tractorvs.com"
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"TractorVS read-only SEO QA"}),timeout=25) as r:
                  return r.read()
          root=ET.fromstring(fetch(base+"/sitemap-index.xml"))
          urls=[]
          for x in root.findall("s:sitemap/s:loc",ns):
              if "image-sitemap" not in x.text:
                  urls.extend(y.text for y in ET.fromstring(fetch(x.text)).findall("s:url/s:loc",ns))
          print("GUIDE_DISCOVERY",json.dumps([u for u in urls if any(t in urlsplit(u).path.lower() for t in ("glossary","terminology","encyclopedia","terimler","tractor-terms","tractor-parts"))]))
          print("BRAND_SITEMAP",json.dumps([u for u in urls if urlsplit(u).path in ("/brands/mccormick/","/brands/valtra/")]))
          path=os.path.join(os.environ["RUNNER_TEMP"],"tractorvs-full-seo.json")
          if os.path.isfile(path):
              d=json.load(open(path))
              print("GRAPH_FIELDS",json.dumps(list(d.get("internalLinks",{}))))
              for k,v in d.get("internalLinks",{}).items():
                  if isinstance(v,list):
                      print("GRAPH_BRAND_CANDIDATES",k,json.dumps([x for x in v if "mccormick" in str(x).lower() or "valtra" in str(x).lower()]))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-live-seo-evidence-20261125
          path: |
            ${{ runner.temp }}/tractorvs-full-seo.json
            ${{ runner.temp }}/tractorvs-full-seo.log
          if-no-files-found: warn
          retention-days: 7
