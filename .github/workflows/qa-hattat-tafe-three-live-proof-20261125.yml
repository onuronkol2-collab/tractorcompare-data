name: TractorVS three Hattat TAFE photos live proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-hattat-tafe-three-live-proof-20261125.yml']
permissions:
  contents: read
jobs:
  live:
    if: github.head_ref == 'qa/hattat-tafe-three-live-proof-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify twenty model routes and nine original-derived JPEGs
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, re, time, urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          origin="https://tractorvs.com"
          locales=["en","tr","zh","hi","pt-br","fr","de","ru","ja","es"]
          evidence=json.loads(Path("site/docs/photo-evidence-hattat-tafe-three-20261125.json").read_text())
          assert len(evidence)==3
          assert len({e['tractorId'] for e in evidence})==2
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canon=[];self.sha=[];self.sources=[];self.licenses=[];self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="link" and "canonical" in a.get("rel","").lower().split():self.canon.append(a.get("href"))
                  if tag=="meta" and a.get("name")=="tractorvs-release-sha":self.sha.append(a.get("content"))
                  if "data-photo-source" in a:self.sources.append(a["data-photo-source"])
                  if "data-photo-license" in a:self.licenses.append(a["data-photo-license"])
                  if tag=="img":self.images.append(a)
          def fetch(path):
              url=origin+path
              req=urllib.request.Request(url,headers={"User-Agent":"TractorVS release verification (read-only; github actions)","Accept-Encoding":"identity"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=200 or r.geturl()!=url:raise ValueError("unexpected HTTP status or redirect")
                  b=r.read(12000001)
                  if len(b)>12000000:raise ValueError("response too large")
                  return b,r.headers.get_content_type()
          def slug(e):
              return re.sub(r"[^a-z0-9]+","-",(e["brand"]+" "+e["model"]).lower()).strip("-")+"-"+e["tractorId"][:8]
          def model(item):
              lang,e=item
              path=("" if lang=="en" else "/"+lang)+"/tractors/"+slug(e)+"/"
              try:
                  b,mime=fetch(path);p=Page();p.feed(b.decode("utf-8"));errors=[]
                  if mime!="text/html":errors.append("mime")
                  if p.canon!=[origin+path]:errors.append("canonical")
                  if len(p.sha)!=1 or not re.fullmatch(r"[0-9a-f]{40}",p.sha[0] or ""):errors.append("release")
                  if not any(e["fileId"] in str(x) for x in p.images):errors.append("model photo missing")
                  if e["sourcePage"] not in p.sources:errors.append("source attribution")
                  if e["licenseUrl"] not in p.licenses:errors.append("license attribution")
                  return {"group":"model","path":path,"errors":errors,"release":p.sha}
              except Exception as ex:return {"group":"model","path":path,"errors":[str(ex)]}
          def image(d):
              path="/images/tractors/"+d["file"]
              try:
                  b,mime=fetch(path);errors=[]
                  if mime!="image/jpeg" or not b.startswith(b"\xff\xd8"):errors.append("mime/jpeg")
                  if len(b)!=d["bytes"] or hashlib.sha256(b).hexdigest()!=d["sha256"]:errors.append("bytes/hash")
                  return {"group":"jpeg","path":path,"errors":errors}
              except Exception as ex:return {"group":"jpeg","path":path,"errors":[str(ex)]}
          for attempt in range(4):
              probe=model(("en",evidence[0]))
              print("PHOTO_RELEASE_READY",json.dumps(probe),flush=True)
              if not probe["errors"]:break
              if attempt<3:time.sleep(20)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(model,[(lang,e) for lang in locales for e in evidence]))+list(pool.map(image,[d for e in evidence for d in e["derivatives"]]))
          for x in results:
              if x["errors"]:print("PHOTO_RELEASE_ERROR",json.dumps(x),flush=True)
          groups={g:{"checked":sum(x["group"]==g for x in results),"passed":sum(x["group"]==g and not x["errors"] for x in results)} for g in ["model","jpeg"]}
          print("PHOTO_RELEASE_LIVE_RESULT",json.dumps({"groups":groups,"checked":len(results),"passed":sum(not x["errors"] for x in results),"releaseShas":sorted({s for x in results for s in x.get("release",[]) if s})}),flush=True)
          if any(x["errors"] for x in results):raise SystemExit(1)
          PY
