name: Read-only live proof of release 661
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/qa-live-proof-661-20261125.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify deployed release and 17 models in all ten locales
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, subprocess, urllib.request, time
          from html.parser import HTMLParser
          origin="https://tractorvs.com"
          target="e9eae56d6806414993076abb25b9de808190cc59"
          models=json.loads("{\"erkunt-kiymet-90-luks-9e5a044f\":[\"https://erkunttraktor.com.tr/assets/model_dosyalar/pdfs/LuksCRD5Brosur.pdf?t=20260304140933\"],\"erkunt-nimet-75-luks-a4405891\":[\"https://erkunttraktor.com.tr/assets/model_dosyalar/pdfs/LuksCRD5Brosur.pdf?t=20260304140933\"],\"erkunt-servet-85-luks-92147203\":[\"https://erkunttraktor.com.tr/assets/model_dosyalar/pdfs/LuksCRD5Brosur.pdf?t=20260304140933\"],\"iseki-tg6407-02035d70\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"iseki-tg6407-94278ba8\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"iseki-tg6507-90cef3af\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"iseki-tg6507-a5c09aff\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"iseki-tg6557-26cf9d66\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"iseki-tg6687-49124a53\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"iseki-tg6687-9778c89d\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"iseki-tg6687-a6e19f7b\":[\"https://www.iseki.co.jp/global/cms/upload/pdf/products/tractor/TG6%20Specification.pdf\"],\"jcb-6260-a2c6eec1\":[\"https://www.jcb.com/en-GB/explore/insight/news/2025/11/jcb-launches-all-new-high-tech-fastrac-6000-series-tractors/\",\"https://www.jcb.com/en-GB/products/machines/agricultural-tractors/6000-series/\"],\"jcb-6300-7c90179a\":[\"https://www.jcb.com/en-GB/explore/insight/news/2025/11/jcb-launches-all-new-high-tech-fastrac-6000-series-tractors/\",\"https://www.jcb.com/en-GB/products/machines/agricultural-tractors/6000-series/\"],\"lindner-lintrac-115-ls-11f9778b\":[\"https://www.lindner-traktoren.at/en/tractors-transporters/lintrac/lintrac-115-ls\"],\"lindner-lintrac-160-ldrive-7999a853\":[\"https://www.lindner-traktoren.at/en/tractors-transporters/tractors/lintrac-160\"],\"lindner-lintrac-75-ls-64999276\":[\"https://www.lindner-traktoren.at/en/tractors-transporters/lintrac/lintrac-75-ls\"],\"lindner-lintrac-95-ls-092125c4\":[\"https://www.lindner-traktoren.at/en/tractors-transporters/lintrac/lintrac-95-ls\"]}")
          locales=["en","tr","zh","hi","pt-br","fr","de","ru","ja","es"]
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.sha=[]; self.canon=[]; self.links=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a" and a.get("href"):self.links.add(a["href"])
                  if tag=="meta" and a.get("name")=="tractorvs-release-sha":self.sha.append(a.get("content"))
                  if tag=="link" and "canonical" in a.get("rel","").lower().split():self.canon.append(a.get("href"))
          def verify(task):
              lang,slug,urls=task
              path=("" if lang=="en" else "/"+lang)+"/tractors/"+slug+"/"
              url=origin+path
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"TractorVS release QA read-only","Accept-Encoding":"identity"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      if response.status!=200 or response.geturl()!=url:raise ValueError("HTTP or redirect")
                      if response.headers.get_content_type()!="text/html":raise ValueError("MIME")
                      raw=response.read(4000001)
                  if len(raw)>4000000:raise ValueError("size")
                  p=Page();p.feed(raw.decode("utf-8"))
                  errors=[]
                  if p.canon!=[url]:errors.append("canonical")
                  if len(p.sha)!=1 or not re.fullmatch(r"[a-f0-9]{40}",p.sha[0] or ""):errors.append("release SHA absent")
                  elif subprocess.run(["git","merge-base","--is-ancestor",target,p.sha[0]],capture_output=True).returncode:errors.append("release SHA not proven to contain #661")
                  missing=sorted(set(urls)-p.links)
                  if missing:errors.append("missing reviewed sources: "+repr(missing))
                  return {"path":path,"sha":p.sha,"errors":errors}
              except Exception as e:return {"path":path,"errors":[str(e)]}
          tasks=[(l,s,u) for l in locales for s,u in models.items()]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(verify,tasks))
          for x in results:
              if x["errors"]:print("LIVE_ERROR",json.dumps(x,ensure_ascii=False))
          print("RELEASE_661_LIVE_RESULT",json.dumps({"checked":len(results),"passed":sum(not x["errors"] for x in results),"releaseShas":sorted({s for x in results for s in x.get("sha",[]) if s})}),flush=True)
          if any(x["errors"] for x in results):raise SystemExit(1)
          PY
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22
      - name: Verify all technical headings on live public pages
        if: always()
        env:
          TRANSLATION_MIN_MODELS: "469"
          TRANSLATION_MAX_TR_OCCURRENCES: "0"
          TRANSLATION_MAX_EN_SOURCE_OCCURRENCES: "0"
          TRANSLATION_ZERO_LOCALES: "tr,zh,hi,de,ru,ja,pt-br,fr,es"
          TRANSLATION_REQUIRE_SPEC_IDENTITIES: "true"
          TRANSLATION_VALIDATE_SEO: "true"
          TRANSLATION_AUDIT_CONCURRENCY: "6"
          TRANSLATION_STRICT: "false"
        run: node site/scripts/published-translation-audit.mjs
