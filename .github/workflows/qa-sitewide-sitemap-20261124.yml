                  except (TimeoutError,urllib.error.URLError):
                      if i==2:raise
                      time.sleep(2*(i+1))
          tasks=[{"locale":l,"url":url(l,"tractors",m["slug"]),"name":m["name"],"variant":m["variant"],"year":m["year"],"group":m["slug"]} for m in models for l in locales]
          tasks += [{"locale":f["locale"],"url":url(f["locale"],"forum",f["slug"]),"exact":f["title"],"group":"forum-origin"} for f in forums]
          def check(t):
              issues=[];title=""
              try:
                  status,final,headers,body=fetch(t["url"])
                  p=Head();p.feed(body)
                  title=p.titles[0].strip() if len(p.titles)==1 else ""
                  if status!=200 or final!=t["url"] or headers.get_content_type()!="text/html":issues.append("http")
                  if p.canonicals!=[t["url"]]:issues.append("canonical")
                  if "noindex" in (" ".join(p.robots)+" "+headers.get("X-Robots-Tag","")).lower():issues.append("noindex")
                  lang={"zh":"zh-hans","pt-br":"pt-br"}.get(t["locale"],t["locale"])
                  if p.lang.lower()!=lang:issues.append("language")
                  if "exact" in t:
                      if title!=t["exact"]:issues.append("title")
                  else:
                      if t["name"] not in title or t["variant"] not in title or (t["year"] is not None and str(t["year"]) not in title):issues.append("title")
              except Exception as e:issues.append(str(e))
              return {"url":t["url"],"locale":t["locale"],"group":t["group"],"title":title,"issues":issues}
          # Avoid 540 requests against an outdated deployment. Check two exact
          # sentinels with bounded retry; no new deployment or paid API calls.
          sentinel=[next(t for t in tasks if t["group"]=="forum-origin" and t["locale"]=="tr"),next(t for t in tasks if t["group"].startswith("antonio-carraro-tony-8700-v") and t["locale"]=="en")]
          ready=False
          for i in range(10):
              s=[check(t) for t in sentinel]
              print("BATCH_READINESS",json.dumps({"attempt":i+1,"checks":s},ensure_ascii=False),flush=True)
              if all(not x["issues"] for x in s):ready=True;break
              if i<9:time.sleep(15)
          if not ready:raise SystemExit("Live deployment not yet verified; no broad crawl performed")
          index=ET.fromstring(fetch(base+"/sitemap-index.xml")[3]);listed=set()
          for loc in index.findall(".//{*}loc"):
              if not loc.text.endswith("/image-sitemap.xml"):
                  if urlsplit(loc.text).netloc!="tractorvs.com":raise SystemExit("Unexpected sitemap origin")
                  tree=ET.fromstring(fetch(loc.text)[3])
                  listed.update(e.findtext("{*}loc") for e in tree.findall("{*}url"))
          with ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(check,tasks))
          for x in results:
              if x["url"] not in listed:x["issues"].append("sitemap")
          groups=collections.defaultdict(list)
          for x in results:groups[x["group"]].append(x)
          for group,items in groups.items():
              if len(set(x["title"] for x in items))!=len(items):
                  for x in items:x["issues"].append("cross-locale duplicate")
          failed=[x for x in results if x["issues"]]
          print("BATCH_LIVE_RESULT",json.dumps({"expected":540,"checked":len(results),"passed":len(results)-len(failed),"failed":len(failed),"models":len(models),"forum":len(forums),"per_locale":{l:sum(not x["issues"] for x in results if x["locale"]==l) for l in locales}},ensure_ascii=False),flush=True)
          for x in failed[:50]:print("BATCH_LIVE_ERROR",json.dumps(x,ensure_ascii=False),flush=True)
          if len(results)!=540 or failed:raise SystemExit(1)
          PY
      - name: Daily production SEO audit across all page types and rotating model sample
        if: always()
        env:
          TRACTORVS_SEO_AUDIT_MODE: daily
          TRACTORVS_SEO_EVIDENCE_PATH: ${{ runner.temp }}/qa-production-seo.json
        run: node site/scripts/production-seo-audit.mjs
      - name: Preserve detailed read-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-production-seo
          path: ${{ runner.temp }}/qa-production-seo.json
          if-no-files-found: warn
          retention-days: 7
