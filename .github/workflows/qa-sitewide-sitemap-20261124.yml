      - name: Verify merged SEO title package on live domain
        if: always()
        run: |
          python3 - <<'PY'
          import urllib.request, re, html, json
          from concurrent.futures import ThreadPoolExecutor
          base="https://tractorvs.com"
          locales=["en","tr","de","es","fr","pt-br","hi","ru","ja","zh"]
          def check(l):
              root=base+("" if l=="en" else "/"+l)+"/tractors/"
              rows=[]
              for model in ["farmtrac-45-powermaxx-8acb2304","iseki-t97-series-3e6886c4"]:
                  url=root+model+"/"
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"TractorVS-public-release-audit/1.0","Cache-Control":"no-cache"}),timeout=20) as res:
                          body=res.read().decode()
                          m=re.search(r"<title[^>]*>(.*?)</title>",body,re.S|re.I)
                          title=html.unescape(m.group(1)).strip() if m else ""
                          if model.startswith("iseki"):
                              verified="Cabin" in title and "ROPS" in title and "ISEKI global catalogue" not in title
                          else:
                              verified="2WD" in title and "constant-mesh 8F+2R" in title and "India / 2WD" not in title
                          rows.append({"locale":l,"model":model,"status":res.status,"title":title,"updated":verified})
                  except Exception as e: rows.append({"locale":l,"model":model,"updated":False,"error":str(e)})
              return rows
          with ThreadPoolExecutor(max_workers=3) as pool:
              result=[row for rows in pool.map(check,locales) for row in rows]
          for row in result: print("TITLE_LIVE",json.dumps(row,ensure_ascii=False))
          print("TITLE_LIVE_TOTAL",sum(x["updated"] for x in result),len(result))
          if not all(x["updated"] for x in result): raise SystemExit(1)
          PY
