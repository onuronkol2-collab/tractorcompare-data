name: Read-only remaining release live proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/remaining-release-live-proof-20261125.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public model, forum, catalogue and JPEG releases
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, re, time, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          origin="https://tractorvs.com"
          locales=["en","tr","zh","hi","pt-br","fr","de","ru","ja","es"]
          models=[
              ("bobcat-ct5550-1d550cce","Bobcat CT5550",[]),
              ("bobcat-ct5555-765c4d39","Bobcat CT5555",[]),
              ("solis-s-26-hst-45b7ce31","Solis S 26 HST",[]),
              ("lindner-lintrac-160-ldrive-7999a853","Lindner Lintrac 160 LDrive",["lindner-lintrac-160-ldrive-marcelx42-front","lindner-lintrac-160-ldrive-marcelx42-rear"]),
              ("lindner-lintrac-95-ls-092125c4","Lindner Lintrac 95 LS",["lindner-lintrac-95-ls-alpin-marcelx42"]),
          ]
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.canon=[];self.ids=set();self.attrs=set();self.sha=[];self.h1=[];self.inh1=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); self.attrs.update(a)
                  if a.get("id"):self.ids.add(a["id"])
                  if tag=="link" and "canonical" in a.get("rel","").lower().split():self.canon.append(a.get("href"))
                  if tag=="meta" and a.get("name")=="tractorvs-release-sha":self.sha.append(a.get("content"))
                  if tag=="h1":self.inh1=True
              def handle_endtag(self,tag):
                  if tag=="h1":self.inh1=False
              def handle_data(self,data):
                  if self.inh1:self.h1.append(data)
          def fetch(path):
              url=origin+path
              request=urllib.request.Request(url,headers={"User-Agent":"TractorVS release verification (read-only; github actions)","Accept-Encoding":"identity"})
              with urllib.request.urlopen(request,timeout=20) as response:
                  if response.status!=200 or response.geturl()!=url:raise ValueError("unexpected HTTP status/redirect")
                  body=response.read(12_000_001)
                  if len(body)>12_000_000:raise ValueError("response above bounded limit")
                  return body,response.headers.get_content_type()
          def verify_html(item):
              group,path,expected,images=item
              try:
                  raw,mime=fetch(path); html=raw.decode("utf-8")
                  p=Page();p.feed(html)
                  errors=[]
                  if mime!="text/html":errors.append("mime")
                  if p.canon!=[origin+path]:errors.append("canonical")
                  if len(p.sha)!=1 or not re.fullmatch(r"[a-f0-9]{40}",p.sha[0] or ""):errors.append("release-sha")
                  if group=="catalogue" and "catalog-facet-market" not in p.ids:errors.append("market-facet-not-present")
                  if group=="forum" and not {"data-forum-model-filter","data-forum-sort","data-forum-pagination"}.issubset(p.attrs):errors.append("forum-browse-not-present")
                  if expected and expected.casefold() not in " ".join("".join(p.h1).split()).casefold():errors.append("model-h1")
                  for img in images:
                      if img not in html:errors.append("missing-model-photo:"+img)
                  return {"group":group,"path":path,"sha":p.sha,"errors":errors}
              except Exception as e:return {"group":group,"path":path,"errors":[str(e)]}
          def verify_image(item):
              path,sha,n=item
              try:
                  raw,mime=fetch(path);errors=[]
                  if mime!="image/jpeg" or not raw.startswith(b"\xff\xd8"):errors.append("mime/jpeg")
                  if len(raw)!=n or hashlib.sha256(raw).hexdigest()!=sha:errors.append("bytes/hash")
                  return {"group":"jpeg","path":path,"errors":errors}
              except Exception as e:return {"group":"jpeg","path":path,"errors":[str(e)]}
          # Small readiness probe for the last merged feature; no unbounded polling.
          for attempt in range(3):
              probe=verify_html(("catalogue","/tr/tractors/","",[]))
              print("RELEASE_READY",json.dumps(probe),flush=True)
              if not probe["errors"]:break
              if attempt<2:time.sleep(15)
          tasks=[]
          for lang in locales:
              prefix="" if lang=="en" else "/"+lang
              tasks.append(("catalogue",prefix+"/tractors/","",[]))
              tasks.append(("forum",prefix+"/forum/","",[]))
              tasks.extend(("model",prefix+"/tractors/"+slug+"/",name,images) for slug,name,images in models)
          evidence=json.loads(Path("site/docs/photo-evidence-lindner-three-20261125.json").read_text())
          assets=[("/images/tractors/"+x["file"],x["sha256"],x["bytes"]) for row in evidence for x in row["derivatives"]]
          assert len(assets)==9
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(verify_html,tasks))+list(pool.map(verify_image,assets))
          for row in results:
              if row["errors"]:print("RELEASE_ERROR",json.dumps(row,ensure_ascii=False),flush=True)
          groups={g:{"checked":sum(x["group"]==g for x in results),"passed":sum(x["group"]==g and not x["errors"] for x in results)} for g in ["catalogue","forum","model","jpeg"]}
          print("RELEASE_LIVE_RESULT",json.dumps({"groups":groups,"checked":len(results),"passed":sum(not x["errors"] for x in results),"releaseShas":sorted({s for x in results for s in x.get("sha",[]) if s})}),flush=True)
          if any(x["errors"] for x in results):raise SystemExit(1)
          PY
