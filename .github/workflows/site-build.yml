name: Site build validation

on:
  pull_request:
    paths:
      - "site/**"
      - "package.json"
      - "wrangler.jsonc"
      - "supabase/migrations/20261115000400_tractorvs_public_catalog_view.sql"
      - "supabase/rollback/20261115000400_tractorvs_public_catalog_view_rollback.sql"
      - "supabase/verification/preflight_tractorvs_public_catalog_view.sql"
      - "supabase/verification/verify_tractorvs_public_catalog_view.sql"
      - ".github/workflows/site-build.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "supabase/verification/preflight_tractorvs_public_catalog_view.sql"
      - "wrangler.jsonc"
      - "package.json"
      - "supabase/migrations/20261115000400_tractorvs_public_catalog_view.sql"
      - "supabase/rollback/20261115000400_tractorvs_public_catalog_view_rollback.sql"
      - "supabase/verification/verify_tractorvs_public_catalog_view.sql"
      - ".github/workflows/site-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Test conservative specification deduplication
        run: npm run test --workspace=tractorvs-site

      - name: Build through the repository-root entrypoint
        run: npm run build

      - name: Verify Wrangler Preview configuration and language routes
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const p of ['wrangler.jsonc','site/wrangler.jsonc']) { const c = JSON.parse(fs.readFileSync(p, 'utf8')); if (!c.previews || typeof c.previews !== 'object') throw new Error(p + ' is missing previews configuration'); }"
          test -f site/dist/index.html
          test -f site/dist/tr/index.html
          test -f site/dist/tractors/index.html
          test -f site/dist/tr/tractors/index.html
          test -f site/dist/robots.txt
          grep -q "noindex,nofollow" site/dist/index.html
          grep -q "noindex,nofollow" site/dist/tr/index.html
          grep -q "Disallow: /" site/dist/robots.txt
          node site/scripts/verify-tractor-glossary-build.mjs noindex

      - name: Validate all ten languages and bundle Cloudflare geo Worker
        run: |
          for locale in zh hi pt-br fr de ru ja es; do
            test -f "site/dist/$locale/index.html"
            test -f "site/dist/$locale/tractors/index.html"
            test -f "site/dist/$locale/compare/index.html"
            grep -q 'noindex,nofollow' "site/dist/$locale/index.html"
          done
          grep -q 'lang="zh-Hans"' site/dist/zh/index.html
          grep -q 'lang="pt-BR"' site/dist/pt-br/index.html
          node --input-type=module -e "import fs from 'node:fs'; for (const p of ['wrangler.jsonc','site/wrangler.jsonc']) { const c=JSON.parse(fs.readFileSync(p,'utf8')); if (!c.main || c.assets?.binding!=='ASSETS' || !c.assets.run_worker_first.includes('/') || !c.assets.run_worker_first.includes('/language/*')) throw new Error('Missing geo Worker setup: '+p) }"
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Validate SEO canonicals and reciprocal ten-language hreflang when explicitly enabled
        env:
          SITE_URL: https://tractorvs.example
          PUBLIC_INDEXING_ENABLED: "true"
        run: |
          npm run build
          test -f site/dist/sitemap-index.xml
          node site/scripts/verify-tractor-glossary-build.mjs indexable
          grep -q '^Allow: /$' site/dist/robots.txt
          grep -q '^Sitemap: https://tractorvs.example/sitemap-index.xml$' site/dist/robots.txt
          if grep -q '^Disallow: /$' site/dist/robots.txt; then echo 'Indexed build incorrectly disallows all crawling'; exit 1; fi
          for locale in en tr zh hi pt-br fr de ru ja es; do
            case "$locale" in
              en) path="site/dist/index.html" ;;
              *) path="site/dist/$locale/index.html" ;;
            esac
            test -f "$path"
            grep -q 'rel="canonical"' "$path"
            grep -q 'hreflang="x-default"' "$path"
            grep -q 'hreflang="de"' "$path"
            grep -q 'hreflang="pt-BR"' "$path"
            grep -q 'hreflang="zh-Hans"' "$path"
          done
