name: TractorVS one-time reviewed Solis 75 photographs transfer
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/solis75-reviewed-photo-transfer-20261126.yml']
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    if: github.head_ref == 'photos/300-target-remaining-wave-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '61a5e9be893a014f4160be2d5eb7cd382578d9ec'
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/download-artifact@v4
        with:
          name: tractorvs-remaining-photo-review-300-20261125
          run-id: 45800488931
          github-token: ${{ github.token }}
          path: /tmp/tractorvs-reviewed
      - name: Build one atomic photo release using exact reviewed image hashes
        run: |
          node --experimental-strip-types --input-type=module -e 'import {APPROVED_TRACTOR_PHOTOS as p} from "./site/src/lib/tractor-photos.ts"; console.log(JSON.stringify(p))' > /tmp/tractorvs-existing.json
          python3 - <<'PY'
          import hashlib,json,re,unicodedata
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          root=Path("/tmp/tractorvs-reviewed")
          report=json.loads((root/"report.json").read_text())
          existing=json.loads(Path("/tmp/tractorvs-existing.json").read_text())
          def title(u):return unquote(urlsplit(u).path.rsplit("/",1)[-1]).replace("File:","",1).replace("_"," ").casefold()
          known={title(p["sourcePage"]) for p in existing}
          seen_ids={p["fileId"] for p in existing}
          selected="""1 0 efda60cc81d978a6d4f14c4dbab287eb8bd6146c9d7658902bbb7a1d6e38f1f4
          3 0 3d0ff88dfa21ca7bf68872320096e1258daa2817e05e54a6d7f61064efd18120"""
          records=[];evidence=[];covered=set();prior=set();originals=set();derivatives=set()
          def slug(x):
              return re.sub(r"[^a-z0-9]+","-",unicodedata.normalize("NFKD",x).encode("ascii","ignore").decode().lower()).strip("-")
          for line in selected.splitlines():
              n,idx,sha=line.split()
              candidates=[x for x in report["entries"] if x.get("file")==f"candidate-{int(n):03d}.jpg"]
              assert len(candidates)==1
              e=candidates[0];t=e["targets"][int(idx)]
              assert e["decoded"] and e["originalSha256"]==sha and sha not in originals
              assert e["license"] in ("CC0","CC BY-SA 4.0") and e["credit"]=="Own work"
              assert e["photographer"].strip() and not e.get("restrictions")
              assert t["tractor_id"]=="39a48550-4804-4700-9a81-ebb5a37ccacd" and t["brand"]=="Solis" and t["model"]=="75 DT MR"
              assert not any(sha in doc.read_text(errors="replace") for doc in Path("site/docs").glob("photo*evidence*.json")), "Original already recorded"
              u=urlsplit(e["sourceUrl"])
              assert u.scheme=="https" and u.netloc=="upload.wikimedia.org" and u.path.startswith("/wikipedia/commons/")
              sourcepath=u.path.removeprefix("/wikipedia/commons/")
              source="https://commons.wikimedia.org/wiki/File:"+sourcepath.rsplit("/",1)[-1]
              if title(source) in known:
                  print("SKIP_ALREADY_REGISTERED",n,source)
                  continue
              fid=slug(t["brand"]+" "+t["model"])+"-archive-"+sha[:12]
              assert fid not in seen_ids
              originals.add(sha);known.add(title(source));seen_ids.add(fid)
              assert [d["width"] for d in e["derivatives"]]==[480,960,1920]
              ds=[]
              for d in e["derivatives"]:
                  data=(root/"derivatives"/d["file"]).read_bytes()
                  assert len(data)==d["bytes"] and hashlib.sha256(data).hexdigest()==d["sha256"] and data[:3]==b"\xff\xd8\xff" and data[-2:]==b"\xff\xd9"
                  assert d["sha256"] not in derivatives
                  derivatives.add(d["sha256"])
                  filename=f"{fid}-{d['width']}.jpg"
                  out=Path("site/public/images/tractors")/filename
                  assert not out.exists()
                  out.write_bytes(data);ds.append({**d,"file":filename})
              license_url="https://creativecommons.org/publicdomain/zero/1.0/" if e["license"]=="CC0" else "https://creativecommons.org/licenses/by-sa/4.0/"
              lu=urlsplit(e["licenseUrl"]); canonical=urlsplit(license_url)
              assert lu.scheme in ("http","https") and lu.netloc=="creativecommons.org" and not lu.query and not lu.fragment
              assert re.sub(r"/deed\.[a-zA-Z-]+/?$","/",lu.path).rstrip("/")==canonical.path.rstrip("/"),"License path mismatch: "+e["licenseUrl"]
              record=dict(brand=t["brand"],model=t["model"],tractorId=t["tractor_id"],fileId=fid,path=sourcepath,photographer=e["photographer"],license=e["license"],width=e["width"],height=e["height"],resizedDerivative=True)
              records.append(record)
              evidence.append({**record,"sourcePage":source,"sourcePageOriginal":e["sourcePage"],"originalUrl":e["sourceUrl"],"licenseUrl":license_url,"originalSha256":sha,"originalSha1":e["verifiedSha1"],"originalBytes":e["originalBytes"],"originalFormat":e["decodedFormat"],"originalFrameCount":e["decodedFrames"],"selectedFrame":e["selectedFrame"],"sourceArtifact":15106478195,"sourceRun":45800488931,"candidate":e["file"],"description":e["description"],"targetVariant":t.get("variant"),"angle":"visually-reviewed-front-side-or-front-quarter","modelEvidence":"Reviewed both front-quarter views in artifact 15106478195. Commons captions identify Solis 75; OEM S75 DT MR identifies the 4WD family. Orange rescue ROPS and older blue cab configurations are representative, not exact trim claims.","modelSources":["https://www.solisturkiye.com/solis-75-dt-mr/"],"scope":"Representative model photo, not exact variant configuration.","copyrightEvidence":"commons-attribution-license-verified-no-owner-claim","changes":"Verified primary frame; proportional resize and JPEG compression; source license retained.","derivatives":ds})
              covered.add(t["tractor_id"])
              if any(p["brand"]==t["brand"] and p["model"]==t["model"] and (not p.get("tractorId") or p["tractorId"]==t["tractor_id"]) for p in existing):prior.add(t["tractor_id"])
          assert len(records)==2 and covered=={"39a48550-4804-4700-9a81-ebb5a37ccacd"} and len(covered-prior)==1
          registry=Path("site/src/lib/historical-licensed-photos.ts")
          s=registry.read_text();marker="\n] as const;"
          assert s.count(marker)==1
          addition="\n".join("  "+json.dumps(p,ensure_ascii=False,separators=(",",":"))+"," for p in records)
          s=s.replace(marker,"\n"+addition+marker);registry.write_text(s)
          evidence_path=Path("site/docs/photo-evidence-solis75-20261126.json")
          assert not evidence_path.exists()
          evidence_path.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+"\n")
          test=Path("site/tests/tractor-photos.test.mjs")
          s=test.read_text()
          s,n=re.subn(r"assert\.equal\(APPROVED_TRACTOR_PHOTOS\.length,\s*"+str(len(existing))+r"\);",f"assert.equal(APPROVED_TRACTOR_PHOTOS.length,{len(existing)+len(records)});",s)
          assert n==1,"Update baseline count only after verified addition"
          s,n=re.subn(r"assert\.equal\(HISTORICAL_LICENSED_PHOTOS\.length,\s*150\);",f"assert.equal(HISTORICAL_LICENSED_PHOTOS.length,{150+len(records)});",s)
          assert n==1,"Historical baseline count must match"
          lindner=sum(x["tractorId"]=="7999a853-ec41-4c44-9f1d-2fa326713a81" for x in records)
          old='assert.equal(tractorPhotos({...tractor("Lindner","Lintrac 160 LDrive"),tractor_id:"7999a853-ec41-4c44-9f1d-2fa326713a81"}).length,1);'
          if lindner:
              assert s.count(old)==1
              s=s.replace(old,old.replace("length,1","length,"+str(1+lindner)))
          s+='''

          test("Solis 75 DT MR representative front photos retain exact UUID, license and byte proofs",()=>{
            const evidence=JSON.parse(readFileSync(new URL("../docs/photo-evidence-solis75-20261126.json",import.meta.url),"utf8"));
            assert.ok(evidence.length>0);
            assert.equal(new Set(evidence.map(e=>e.originalSha256)).size,evidence.length);
            for(const e of evidence){
              const exact={...tractor(e.brand,e.model),tractor_id:e.tractorId};
              const p=tractorPhotos(exact).find(x=>x.fileId===e.fileId);
              assert.ok(p,e.fileId);
              assert.equal(p.configurationExact,false);assert.equal(p.resizedDerivative,true);
              assert.equal(p.photographer,e.photographer);assert.equal(p.licenseUrl,e.licenseUrl);
              assert.equal(p.sourcePage,e.sourcePage);assert.equal(e.angle,"visually-reviewed-front-side-or-front-quarter");
              for(const wrong of [{...exact,tractor_id:"00000000-0000-4000-8000-000000000000"},{...exact,model_name:e.model+" WRONG"},{...exact,brand_name:"Other"}])assert.ok(!tractorPhotos(wrong).some(x=>x.fileId===p.fileId));
              assert.deepEqual(e.derivatives.map(d=>d.width),[480,960,1920]);
              for(const d of e.derivatives){
                const b=readFileSync(new URL("../public/images/tractors/"+d.file,import.meta.url));
                assert.equal(b.length,d.bytes);assert.equal(createHash("sha256").update(b).digest("hex"),d.sha256);
                assert.equal(b.subarray(0,3).toString("hex"),"ffd8ff");assert.equal(b.subarray(-2).toString("hex"),"ffd9");
                assert.ok(resolveApprovedPhotoSource("/images/tractors/"+d.file),d.file);
              }
              const primary=tractorPhotos(exact)[0];
              for(const locale of LOCALES){
                const im=modelStructuredData(exact,locale,"https://tractorvs.com/")["@graph"].find(x=>x["@type"]==="ImageObject");
                assert.ok(im,locale);assert.equal(im.creator?.name,primary.photographer);
                assert.equal(im.license,primary.licenseUrl);assert.equal(im.acquireLicensePage,primary.sourcePage);
                assert.ok(photoText(locale,"representative").length>10);
              }
            }
          });
          '''
          test.write_text(s)
          print("BULK_RELEASE_STAGED",json.dumps({"newOriginals":len(records),"derivatives":len(derivatives),"modelUUIDs":len(covered),"previouslyUncoveredUUIDs":len(covered-prior),"models":[{"brand":p["brand"],"model":p["model"],"uuid":p["tractorId"]} for p in records]}),flush=True)
          PY
          git add site/public/images/tractors site/src/lib/historical-licensed-photos.ts site/tests/tractor-photos.test.mjs site/docs/photo-evidence-solis75-20261126.json
          git -c user.name=tractorvs-photo-release -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "feat(photo): add two reviewed front views for previously photo-less Solis 75 DT MR"
          git push origin HEAD:refs/heads/photos/solis75-reviewed-bulk-20261126
