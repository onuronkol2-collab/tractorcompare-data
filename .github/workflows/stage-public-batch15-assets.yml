name: TractorVS temporary batch15 exact-photo staging to isolated branch only
on:
  push:
    branches:
      - perf/public-batch15-verified-720-mobile-photos-20261122
    paths:
      - "site/scripts/photo-batch15-public-stage.mjs"
      - "site/scripts/stage-public-batch15-photo-assets.py"
      - ".github/workflows/stage-public-batch15-assets.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: tractorvs-public-photo-batch15-exact-binary-staging
  cancel-in-progress: false
jobs:
  stage-verified-only:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/perf/public-batch15-verified-720-mobile-photos-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned free JPEG/WebP binary decoder
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Fetch immutable successful 18-photo source artifact, not Wikimedia
        uses: actions/download-artifact@v4
        with:
          name: tractorvs-batch18-photo-720-offline-QA-evidence
          run-id: 45029082604
          github-token: ${{ github.token }}
          path: /tmp/tractorvs-audited-batch18
      - name: Reconfirm 15 published model photos from real live image sitemap
        run: |
          mkdir -p /tmp/tractorvs-audited-batch15
          node --experimental-strip-types site/scripts/photo-batch15-public-stage.mjs /tmp/tractorvs-audited-batch15/eligible.json
      - name: Verify each licensed binary and stage 30 files plus full provenance ledger
        run: |
          python site/scripts/stage-public-batch15-photo-assets.py \
            --manifest /tmp/tractorvs-audited-batch15/eligible.json \
            --artifact /tmp/tractorvs-audited-batch18 \
            --output site/public/images/tractors \
            --ledger site/docs/photo-mobile-batch15-evidence.json
      - name: Commit ONLY thirty verified assets plus one evidence ledger to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/public/images/tractors/*-720.jpg site/public/images/tractors/*-720.webp site/docs/photo-mobile-batch15-evidence.json
          mapfile -t changed < <(git diff --cached --name-only)
          if [[ "${#changed[@]}" -ne 31 ]]; then
            echo "::error::Expected 30 new photos and one proof JSON, got ${#changed[@]}"; exit 1
          fi
          count_images=0
          for f in "${changed[@]}"; do
            if [[ "$f" == site/docs/photo-mobile-batch15-evidence.json ]]; then continue; fi
            [[ "$f" =~ ^site/public/images/tractors/[a-z0-9-]+-720\.(jpg|webp)$ ]] || {
              echo "::error::Unexpected path $f"; exit 1; }
            ((count_images+=1))
          done
          [[ "$count_images" -eq 30 ]] || { echo "::error::Wrong image count"; exit 1; }
          git commit -m 'perf(photo): stage fifteen public CC images, thirty SHA-verified mobile assets'
          git push origin HEAD:refs/heads/perf/public-batch15-verified-720-mobile-photos-20261122
          echo "Staged PR branch ONLY; no main deployment performed."
