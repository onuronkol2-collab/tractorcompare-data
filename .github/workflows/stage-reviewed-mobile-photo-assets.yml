name: TractorVS stage six pinned 720px photo assets on isolated branch
on:
  push:
    branches:
      - perf/three-local-720-photo-assets-20261122
    paths:
      - "site/scripts/stage-reviewed-mobile-assets.py"
      - "site/docs/photo-mobile-720-artifact-evidence.json"
      - ".github/workflows/stage-reviewed-mobile-photo-assets.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: tractorvs-stage-verified-photo-assets
  cancel-in-progress: false
jobs:
  stage-only:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/perf/three-local-720-photo-assets-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned image decoder (no resizing, no Wikimedia requests)
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Read exact previous successful rights-approved GitHub Actions artifact
        uses: actions/download-artifact@v4
        with:
          name: tractorvs-offline-photo-720-reviewed-candidates
          run-id: 45023575546
          github-token: ${{ github.token }}
          path: /tmp/tractorvs-verified-720
      - name: Check all six binary SHA-256, dimensions, attribution and identities before writing
        run: |
          python site/scripts/stage-reviewed-mobile-assets.py \
            --evidence site/docs/photo-mobile-720-artifact-evidence.json \
            --artifact-dir /tmp/tractorvs-verified-720 \
            --output-dir site/public/images/tractors
      - name: Stage only six reviewed binary files on this isolated PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/public/images/tractors/*-720.jpg site/public/images/tractors/*-720.webp
          if git diff --cached --quiet; then
            echo "Exactly reviewed image assets already committed; no changes."
            exit 0
          fi
          count="$(git diff --cached --name-only | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "::error::Exactly six reviewed image binaries must be staged, got $count"; exit 1
          fi
          git commit -m 'perf(photo): stage six SHA-pinned licensed 720px derivatives for PR review'
          git push origin HEAD:refs/heads/perf/three-local-720-photo-assets-20261122
          echo "Staged only on the isolated branch; no main merge or deploy."
