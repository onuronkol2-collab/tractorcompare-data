name: TractorVS stage 24 reviewed third-wave photo files on isolated branch
on:
  push:
    branches: [perf/third-wave-12-public-720-live-release-20261122]
    paths:
      - "site/scripts/stage-third-wave-720-assets.py"
      - "site/docs/photo-mobile-third-wave-assets-evidence.json"
      - ".github/workflows/stage-third-wave-720-assets.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: tractorvs-third-wave-exact-sha-stage
  cancel-in-progress: false
jobs:
  stage-only:
    name: Import exact offline artifact 24 files; no main merge or deploy
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/perf/third-wave-12-public-720-live-release-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use pinned no-cost local decoder for SHA/MIME verification
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - name: Download precise completed zero-publication QA artifact
        uses: actions/download-artifact@v4
        with:
          name: tractorvs-third-wave-twelve-licensed-photo-QA-only
          run-id: 45034166209
          github-token: ${{ github.token }}
          path: /tmp/tractorvs-third-wave-verified
      - name: Verify all 12 source identities and 24 actual files before staging
        run: |
          python site/scripts/stage-third-wave-720-assets.py \
            --evidence site/docs/photo-mobile-third-wave-assets-evidence.json \
            --artifact /tmp/tractorvs-third-wave-verified \
            --output site/public/images/tractors
      - name: Commit only 24 SHA-pinned binaries on isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/public/images/tractors/*-720.jpg site/public/images/tractors/*-720.webp
          if git diff --cached --quiet; then
            echo "No newly verified image assets to stage"; exit 0
          fi
          count="$(git diff --cached --name-only | wc -l)"
          if [[ "$count" != 24 ]]; then
            echo "::error::Expected exactly 24 newly verified JPEG/WebP binaries, got $count"; exit 1
          fi
          git commit -m 'perf(photo): stage 24 SHA-verified CC-licensed third-wave image derivatives'
          git push origin HEAD:refs/heads/perf/third-wave-12-public-720-live-release-20261122
          echo "Verified images staged ONLY on the isolated branch; no production deploy."
