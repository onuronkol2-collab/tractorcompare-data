name: Stage verified Zetor Major CL80 candidate only
on:
  push:
    branches: [photos/zetor-major-cl80-20261124]
    paths:
      - ".github/workflows/stage-zetor-major-cl80-20261124.yml"
permissions:
  actions: read
  contents: write
concurrency:
  group: tractorvs-zetor-major-cl80-20261124
  cancel-in-progress: false
jobs:
  stage_verified_photo:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/photos/zetor-major-cl80-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tractorvs-curated-source-review-20261124
          run-id: 45422737022
          github-token: ${{ github.token }}
          path: review-input
      - name: Install distribution-maintained image processing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          command -v identify
          command -v convert
      - name: Verify pinned original and prepare proportional JPEGs
        run: python3 site/scripts/stage-zetor-major-cl80-20261124.py
      - name: Commit only reviewed photo assets and evidence on candidate branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/images/tractors/zetor-major-cl80-jj7777-{480,960,1920}.jpg site/docs/photo-evidence-zetor-major-cl80-20261124.json
          git commit -m "Stage verified Zetor Major CL80 licensed JPEGs and SHA evidence"
          git push origin HEAD:photos/zetor-major-cl80-20261124
