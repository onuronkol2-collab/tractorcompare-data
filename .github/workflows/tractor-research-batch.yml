name: TractorVS controlled research batch

on:
  pull_request:
    paths:
      - ".github/workflows/tractor-research-batch.yml"
      - "scripts/tractor-research-batch.mjs"
      - "scripts/tractor-research-batch.test.mjs"
      - "scripts/tractor-research-continuation.mjs"
      - "scripts/tractor-research-continuation.test.mjs"
      - "scripts/tractor-research-budget.mjs"
      - "scripts/tractor-research-budget.test.mjs"
      - "scripts/tractor-research-budget-guard.mjs"
      - "scripts/tractor-research-watchdog.mjs"
      - "scripts/tractor-research-watchdog.test.mjs"
      - "scripts/tractor-targeted-claim-guard.test.mjs"
      - "scripts/tractor-free-source-triage.mjs"
      - "scripts/tractor-free-source-triage.test.mjs"
      - "scripts/tractor-oem-source-review-batch.test.mjs"
      - "supabase/maintenance/20261121_oem_source_review_batch.sql"
      - "supabase/rollback/20261121_oem_source_review_batch_rollback.sql"
      - "supabase/verification/20261121_oem_source_review_packet_check.sql"
      - "supabase/docs/free-first-source-triage.md"
      - "supabase/migrations/20261121093000_tractorvs_targeted_research_draft_guard.sql"
      - "supabase/rollback/20261121093000_tractorvs_targeted_research_draft_guard_rollback.sql"
      - "supabase/verification/preflight_targeted_research_draft_guard.sql"
      - "supabase/verification/verify_targeted_research_draft_guard.sql"
      - ".github/workflows/tractorvs-research-watchdog.yml"
      - "supabase/docs/bulk-research-runbook.md"
  workflow_dispatch:
    inputs:
      batches:
        description: "Number of batches (each up to 3 tractor queue entries)"
        type: choice
        options:
          - "1"
        default: "1"
        required: true
      remaining_cycles:
        description: "Further runs triggered immediately after successful completion; zero disables chaining"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "4"
          - "8"
        default: "2"
        required: true

permissions:
  contents: read

concurrency:
  group: tractorvs-research-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test queue caps, authentication and failure handling
        run: node --test scripts/tractor-research-batch.test.mjs scripts/tractor-research-continuation.test.mjs scripts/tractor-research-budget.test.mjs scripts/tractor-research-watchdog.test.mjs scripts/tractor-targeted-claim-guard.test.mjs scripts/tractor-free-source-triage.test.mjs scripts/tractor-oem-source-review-batch.test.mjs

  process:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce UTC daily and monthly dispatch ceilings before any paid work
        id: research_quota
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_BATCHES: ${{ github.event.inputs.batches }}
        run: node scripts/tractor-research-budget-guard.mjs
      - name: Process explicitly bounded queue batch
        if: steps.research_quota.outputs.allowed == 'true'
        env:
          TRACTORVS_BATCHES: ${{ github.event.inputs.batches }}
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
        run: node scripts/tractor-research-batch.mjs
      - name: Upload restart-safe progress receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tractorvs-research-progress
          path: tractor-research-progress.json
          if-no-files-found: warn
          retention-days: 14
      - name: Check conservative quota before automatic continuation
        id: continuation_quota
        if: success() && github.event_name == 'workflow_dispatch' && steps.research_quota.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_BUDGET_MODE: continuation
        run: node scripts/tractor-research-budget-guard.mjs
      - name: Dispatch next bounded research run immediately after success
        if: success() && github.event_name == 'workflow_dispatch' && steps.continuation_quota.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_BATCHES: ${{ github.event.inputs.batches }}
          TRACTORVS_REMAINING_CYCLES: ${{ github.event.inputs.remaining_cycles }}
        run: node scripts/tractor-research-continuation.mjs
