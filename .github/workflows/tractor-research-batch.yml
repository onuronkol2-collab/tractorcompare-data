name: TractorVS controlled research batch

on:
  pull_request:
    paths:
      - ".github/workflows/tractor-research-batch.yml"
      - "scripts/tractor-research-batch.mjs"
      - "scripts/tractor-research-batch.test.mjs"
      - "scripts/tractor-research-continuation.mjs"
      - "scripts/tractor-research-continuation.test.mjs"
      - "supabase/docs/bulk-research-runbook.md"
  workflow_dispatch:
    inputs:
      batches:
        description: "Number of batches (each up to 3 tractor queue entries)"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"
        default: "1"
        required: true
      remaining_cycles:
        description: "Further runs triggered immediately after successful completion; zero disables chaining"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "4"
          - "8"
        default: "2"
        required: true

permissions:
  contents: read

concurrency:
  group: tractorvs-research-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test queue caps, authentication and failure handling
        run: node --test scripts/tractor-research-batch.test.mjs scripts/tractor-research-continuation.test.mjs
      - name: Read-only verify both research secrets and queue gateway
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const jwt = process.env.TRACTORVS_SUPABASE_ANON_JWT ?? "";
          const secret = process.env.TRACTORVS_QUEUE_SECRET ?? "";
          if (!jwt || !secret) {
            console.error("MISSING_SECRET: anon JWT " + (jwt ? "present" : "absent") + ", queue secret " + (secret ? "present" : "absent"));
            process.exit(1);
          }
          let jwtRole;
          try { jwtRole = JSON.parse(Buffer.from(jwt.split(".")[1], "base64url").toString("utf8")).role; }
          catch { console.error("INVALID_ANON_JWT_FORMAT"); process.exit(1); }
          if (jwtRole !== "anon") { console.error("INVALID_ANON_JWT_ROLE"); process.exit(1); }
          let response;
          try {
            response = await fetch("https://aaufxtcvnzgavtlintiv.supabase.co/functions/v1/tractor-ai-research", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": jwt,
                "Authorization": "Bearer " + jwt,
                "x-queue-secret": secret,
              },
              body: JSON.stringify({ action: "queue_stats" }),
              signal: AbortSignal.timeout(25000),
            });
          } catch (error) {
            console.error("GATEWAY_NETWORK_CHECK_FAILED: " + (error?.name || "network_error"));
            process.exit(1);
          }
          if (response.status !== 200) {
            const failure = await response.json().catch(() => ({}));
            const code = String(failure?.error?.code ?? failure?.code ?? "");
            const msg = String(failure?.error?.message ?? failure?.error ?? failure?.message ?? "");
            if (/x-queue-secret|araştırma kuyruğu|queue.secret/i.test(msg)) {
              console.error("QUEUE_SECRET_REJECTED: Supabase function rejected x-queue-secret.");
            } else if (/jwt|token|invalid.*key/i.test(msg + " " + code)) {
              console.error("JWT_REJECTED_BY_SUPABASE_GATEWAY.");
            } else {
              console.error("QUEUE_GATEWAY_REJECTED_HTTP_" + response.status + "_UNCLASSIFIED");
            }
            process.exit(1);
          }
          const body = await response.json().catch(() => null);
          if (body?.success !== true || typeof body.queue?.queued !== "number") {
            console.error("QUEUE_STATS_INVALID_RESPONSE");
            process.exit(1);
          }
          console.log("VERIFIED: Both GitHub secrets exist, anon JWT is accepted, and queue secret is authenticated.");
          console.log("Read-only queue check: queued=" + body.queue.queued + "; no research jobs were started.");
          NODE

  process:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Process explicitly bounded queue batch
        env:
          TRACTORVS_BATCHES: ${{ github.event.inputs.batches }}
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
        run: node scripts/tractor-research-batch.mjs
      - name: Upload restart-safe progress receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-research-progress
          path: tractor-research-progress.json
          if-no-files-found: warn
          retention-days: 14
      - name: Dispatch next bounded research run immediately after success
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_BATCHES: ${{ github.event.inputs.batches }}
          TRACTORVS_REMAINING_CYCLES: ${{ github.event.inputs.remaining_cycles }}
        run: node scripts/tractor-research-continuation.mjs
