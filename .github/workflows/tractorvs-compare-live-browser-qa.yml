name: TractorVS live comparison interaction QA

on:
  # Test-only PRs can safely validate the currently deployed public site.
  # This does NOT verify deployment of prospective source changes.
  pull_request:
    paths:
      - "site/e2e/tractorvs-live-compare.spec.mjs"
      - ".github/workflows/tractorvs-compare-live-browser-qa.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/scripts/live-release-readiness.mjs"
      - "site/src/lib/compare-display.mjs"
      - "site/src/lib/combobox-navigation.mjs"
      - "site/src/lib/compare-conditions.ts"
      - "site/src/lib/compare-ux.ts"
      - "site/src/components/TractorComparison.astro"
      - "site/src/components/TractorCatalog.astro"
      - "site/src/lib/catalog-facets.mjs"
      - "site/src/layouts/SiteLayout.astro"
      - "site/e2e/tractorvs-live-compare.spec.mjs"
      - "site/playwright.live.config.mjs"
      - ".github/workflows/tractorvs-compare-live-browser-qa.yml"
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read

concurrency:
  # Isolate production pushes from read-only PR checks and scheduled QA.
  # A newer production push supersedes an older run against stale content;
  # this never cancels CI jobs in other workflows.
  group: tractorvs-live-compare-qa-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      COMPARE_QA_PREDEPLOY: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      # Cloudflare receives the main push independently of GitHub Actions.
      # Avoid testing the previous deployment and reporting a false regression.
      - name: Await coherent verified Cloudflare release (bounded)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/scripts/live-release-readiness.mjs "$GITHUB_SHA" /tr/compare/ /tr/tractors/
      - name: Install locked project and pinned browser QA tools
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.65.1
      - name: Install desktop and mobile browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check the actual public TractorVS interaction and citations
        run: npx playwright test --config site/playwright.live.config.mjs
      - name: Upload screenshots and traces on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tractorvs-live-compare-browser-evidence
          path: |
            site/playwright-live-report
            site/test-results-live
          if-no-files-found: ignore
          retention-days: 7
