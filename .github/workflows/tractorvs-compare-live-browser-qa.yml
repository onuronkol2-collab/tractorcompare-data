name: TractorVS live comparison interaction QA

on:
  # Test-only PRs can safely validate the currently deployed public site.
  # This does NOT verify deployment of prospective source changes.
  pull_request:
    paths:
      - "site/e2e/tractorvs-live-compare.spec.mjs"
      - "site/playwright.live.config.mjs"
      - "site/scripts/live-release-readiness.mjs"
      - "site/scripts/workers-build-readiness.mjs"
      - "site/scripts/verify-live-browser-report.mjs"
      - "site/tests/live-browser-report.test.mjs"
      - ".github/workflows/tractorvs-compare-live-browser-qa.yml"
  workflow_dispatch:
  # GITHUB_TOKEN ledger commits do not trigger another push workflow. The
  # successful trusted main ledger completion can supersede stale live QA.
  workflow_run:
    workflows: ["TractorVS evidence-based sitemap lastmod ledger"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "site/scripts/live-release-readiness.mjs"
      - "site/scripts/workers-build-readiness.mjs"
      - "site/scripts/verify-live-browser-report.mjs"
      - "site/tests/live-browser-report.test.mjs"
      - "site/src/lib/compare-display.mjs"
      - "site/src/lib/combobox-navigation.mjs"
      - "site/src/lib/compare-conditions.ts"
      - "site/src/lib/compare-ux.ts"
      - "site/src/components/TractorComparison.astro"
      - "site/src/components/TractorCatalog.astro"
      - "site/src/lib/catalog-facets.mjs"
      - "site/src/layouts/SiteLayout.astro"
      - "site/e2e/tractorvs-live-compare.spec.mjs"
      - "site/playwright.live.config.mjs"
      - ".github/workflows/tractorvs-compare-live-browser-qa.yml"
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read
  checks: read

concurrency:
  # Isolate production pushes from read-only PR checks and scheduled QA.
  # A newer production push supersedes an older run against stale content;
  # this never cancels CI jobs in other workflows.
  group: tractorvs-live-compare-qa-${{ (github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha != github.sha)) && 'production-push-main' || format('{0}-{1}', github.event_name, github.event.pull_request.number || (github.event_name == 'workflow_run' && github.run_id) || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha != github.sha) }}

jobs:
  release-readiness:
    # Ignore PR, failed and unchanged ledger runs. Never execute their artifacts.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha != github.sha) }}
    # One inexpensive shared gate, before any runner installs a browser.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Await coherent verified Cloudflare release (bounded)
        id: release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_REQUIRE_WORKERS_BUILD: "true"
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node site/scripts/live-release-readiness.mjs "$GITHUB_SHA" /tr/compare/ /tr/tractors/
      - name: Explain predeployment scope
        if: github.event_name == 'pull_request'
        run: echo "PR baseline tests public production, not this unmerged revision." >> "$GITHUB_STEP_SUMMARY"

  live-browser-projects:
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Conservative production pilot: at most two read-only browser projects.
      max-parallel: 2
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: mobile-chromium
            engine: chromium
    env:
      CI: "true"
      COMPARE_QA_PREDEPLOY: ${{ github.event_name == 'pull_request' }}
      BROWSER_PROJECT: ${{ matrix.project }}
      RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked project and pinned browser QA tools
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.65.1
      - name: Install only the required browser engine
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: npx playwright install --with-deps "$BROWSER_ENGINE"
      - name: Verify exact shared release before browser tests
        if: github.event_name != 'pull_request'
        env:
          TRACTORVS_EXACT_SNAPSHOT: "true"
        run: node site/scripts/live-release-readiness.mjs "$RELEASE_SHA" /tr/compare/ /tr/tractors/
      - name: Check the actual public TractorVS interaction and citations
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/tractorvs-live-browser-report.json
        run: npx playwright test --config site/playwright.live.config.mjs --project="$BROWSER_PROJECT"
      - name: Require complete and non-flaky executed evidence
        run: node site/scripts/verify-live-browser-report.mjs "$RUNNER_TEMP/tractorvs-live-browser-report.json" "$BROWSER_PROJECT" "$COMPARE_QA_PREDEPLOY"
      - name: Verify exact shared release after browser tests
        if: github.event_name != 'pull_request'
        env:
          TRACTORVS_EXACT_SNAPSHOT: "true"
        run: node site/scripts/live-release-readiness.mjs "$RELEASE_SHA" /tr/compare/ /tr/tractors/
      - name: Upload per-project screenshots traces and execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tractorvs-live-compare-browser-evidence-${{ matrix.project }}
          path: |
            site/playwright-live-report
            site/test-results-live
            ${{ runner.temp }}/tractorvs-live-browser-report.json
          if-no-files-found: ignore
          retention-days: 7

  production-browser:
    # Preserve the existing aggregate check name; no success on a missing job.
    needs: [release-readiness, live-browser-projects]
    if: ${{ always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha != github.sha)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Require complete shared gate and all four browser projects
        env:
          RELEASE_RESULT: ${{ needs.release-readiness.result }}
          MATRIX_RESULT: ${{ needs.live-browser-projects.result }}
          PREDEPLOY: ${{ github.event_name == 'pull_request' }}
          RELEASE_SHA: ${{ needs.release-readiness.outputs.release_sha }}
        run: |
          test "$RELEASE_RESULT" = success
          test "$MATRIX_RESULT" = success
          if [ "$PREDEPLOY" = true ]; then
            echo "All four predeployment baseline projects passed; not new live release evidence." >> "$GITHUB_STEP_SUMMARY"
          else
            test -n "$RELEASE_SHA"
            echo "All four projects passed against coherent release $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
