name: TractorVS published forum static content refresh
# Read only actual approved public posts from RLS-protected Supabase views.
# Never read pending posts, service-role credentials or private user data.
# DE release audit (22 Nov 2026): refresh the now-approved third public locale;
# runtime logic, secrets and permissions remain unchanged.
# 22 Nov 2026 release audit: after separately approving the EN forum translation,
# this workflow may refresh its already-public fingerprint; it never grants approval.
# 24 Nov 2026: request immediate refresh for all ten approved locales of the
# tractor brand origins article. Only existing anonymous public fingerprint sync runs.
## 25 Nov 2026: refresh five approved topics (50 locale rows), including the 2026-only recall revision.
# No runtime logic, permission, source approval or scheduling changes.
on:
  # GitHub schedules are best effort and can be delayed; avoid hour boundaries.
  # Recheck public RLS views every ten minutes (cheap when unchanged).
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tractorvs-forum-publication-autosync.yml"
  pull_request:
    paths:
      - ".github/workflows/tractorvs-forum-publication-autosync.yml"
      - "scripts/tractor-forum-publication-autosync.mjs"
      - "scripts/tractor-forum-publication-autosync.test.mjs"
      - "site/src/data/public-forum-sync.json"
      - "scripts/tractorvs-publication-candidate.mjs"
      - "site/tests/publication-candidate.test.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only, do not commit forum sitemap/site revision"
        type: boolean
        required: true
        default: true
concurrency:
  group: tractorvs-published-forum-revision
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Check anonymity, pagination, no publish and safe revision behaviour
        run: node --test scripts/tractor-forum-publication-autosync.test.mjs
  sync:
    if: github.event_name != 'pull_request' && github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main' && vars.TRACTORVS_PR_ONLY_CUTOVER != 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Request Cloudflare static rebuild only when approved forum fingerprint changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_FORUM_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: node scripts/tractor-forum-publication-autosync.mjs

  protected_candidate:
    needs: validate
    if: github.event_name != 'pull_request' && github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main' && vars.TRACTORVS_PR_ONLY_CUTOVER == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tractorvs-integrated-publication-pilot.yml
    with:
      kind: forum
      create_candidate: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
      automatic: true
    secrets: inherit
