name: TractorVS forum translation status (manual-only, no provider calls)

# A checked box creates queue jobs; this workflow actually processes them.
# Never use a service-role key in GitHub. Supabase holds private privileges.
on:
  pull_request:
    paths:
      - ".github/workflows/tractorvs-forum-translation.yml"
      - "AGENTS.md"
      - "scripts/tractor-forum-manual-translation-qa*.mjs"
      - "scripts/tractor-forum-translate-dispatch.mjs"
      - "scripts/tractor-forum-translate-dispatch.test.mjs"
      - "scripts/tractor-forum-cloudflare-smoke*.mjs"
      - "scripts/tractor-forum-cloudflare-batch*.mjs"
      - "supabase/functions/tractor-forum-translate/**"
  # No schedule or push translation calls. No provider or queue process jobs.
  workflow_dispatch:
    inputs:
      onay:
        description: "Yalnızca ücretsiz ve salt-okunur kuyruk kontrolü; çeviri API çağrıları kapalı"
        required: true
        type: choice
        default: KONTROL
        options:
          - KONTROL

permissions:
  contents: read
concurrency:
  group: tractorvs-private-forum-translation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Test permission boundaries, jobs and receipts
        run: node --test scripts/tractor-forum-translate-dispatch.test.mjs scripts/tractor-forum-cloudflare-smoke.test.mjs scripts/tractor-forum-cloudflare-batch.test.mjs scripts/tractor-forum-manual-translation-qa.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck private worker without secrets or paid API calls
        run: deno check --no-config supabase/functions/tractor-forum-translate/index.ts
      - name: Run offline legacy provider contract regressions (no external calls)
        run: deno test --no-config supabase/functions/tractor-forum-translate/gemini-provider.test.ts supabase/functions/tractor-forum-translate/translation-quality.test.ts supabase/functions/tractor-forum-translate/translation-segments.test.ts supabase/functions/tractor-forum-translate/azure-translator.test.ts supabase/functions/tractor-forum-translate/cloudflare-m2m100.test.ts supabase/functions/tractor-forum-translate/cloudflare-smoke.test.ts supabase/functions/tractor-forum-translate/cloudflare-batch.test.ts supabase/functions/tractor-forum-translate/queue-control.test.ts

  status:
    # KONTROL never calls Gemini; only reports private queue counters.
    if: github.event_name == 'workflow_dispatch' && inputs.onay == 'KONTROL' && github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Read-only authenticated forum queue status; zero paid calls
        env:
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
          TRACTORVS_TRANSLATION_STATUS_ONLY: "true"
        run: node scripts/tractor-forum-translate-dispatch.mjs
