name: TractorVS consented forum translations

# A checked box creates queue jobs; this workflow actually processes them.
# Never use a service-role key in GitHub. Supabase holds private privileges.
on:
  pull_request:
    paths:
      - ".github/workflows/tractorvs-forum-translation.yml"
      - "scripts/tractor-forum-translate-dispatch.mjs"
      - "scripts/tractor-forum-translate-dispatch.test.mjs"
      - "supabase/functions/tractor-forum-translate/**"
  # No schedule or push translation calls. User deliberately chooses when work runs.
  workflow_dispatch:
    inputs:
      onay:
        description: "Varsayılan KONTROL ücretsizdir; ONAY ayrıca Supabase kuyruk kilidi açılmadan işlem yapmaz; TEST bir sentetik çağrı"
        required: true
        type: choice
        default: KONTROL
        options:
          - KONTROL
          - TEST
          - ONAY

permissions:
  contents: read
concurrency:
  group: tractorvs-private-forum-translation
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Test permission boundaries, jobs and receipts
        run: node --test scripts/tractor-forum-translate-dispatch.test.mjs scripts/tractor-forum-cloudflare-smoke.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck private worker without secrets or paid API calls
        run: deno check --no-config supabase/functions/tractor-forum-translate/index.ts
      - name: Run isolated Cloudflare, Azure and Gemini provider contract tests (no external calls or charges)
        run: deno test --no-config supabase/functions/tractor-forum-translate/gemini-provider.test.ts supabase/functions/tractor-forum-translate/translation-quality.test.ts supabase/functions/tractor-forum-translate/translation-segments.test.ts supabase/functions/tractor-forum-translate/azure-translator.test.ts supabase/functions/tractor-forum-translate/cloudflare-m2m100.test.ts supabase/functions/tractor-forum-translate/cloudflare-smoke.test.ts supabase/functions/tractor-forum-translate/queue-control.test.ts

  status:
    # KONTROL never calls Gemini; only reports private queue counters.
    if: github.event_name == 'workflow_dispatch' && inputs.onay == 'KONTROL' && github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Read-only authenticated forum queue status; zero paid calls
        env:
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
          TRACTORVS_TRANSLATION_STATUS_ONLY: "true"
        run: node scripts/tractor-forum-translate-dispatch.mjs
  synthetic_test:
    # Exactly one synthetic provider request; cannot read/claim real forum jobs.
    # Never runs automatically or on PRs, and never calls Gemini/Azure.
    if: github.event_name == 'workflow_dispatch' && inputs.onay == 'TEST' && github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Call exactly one synthetic Cloudflare M2M100 sentence
        env:
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
        run: node scripts/tractor-forum-cloudflare-smoke.mjs
  process:
    if: github.event_name == 'workflow_dispatch' && inputs.onay == 'ONAY' && github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Process up to three published, opted-in topic translations
        env:
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
        run: node scripts/tractor-forum-translate-dispatch.mjs
