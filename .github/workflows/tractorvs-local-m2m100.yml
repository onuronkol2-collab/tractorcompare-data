name: Local M2M100 reference pilot
on:
  pull_request:
    paths:
      - 'scripts/tractor_forum_local_m2m100.py'
      - 'scripts/test_tractor_forum_local_m2m100.py'
      - '.github/workflows/tractorvs-local-m2m100.yml'
  workflow_dispatch:
    inputs:
      onay:
        description: 'Synthetic CPU model smoke test; no forum data or provider API'
        required: true
        type: choice
        options:
          - KONTROL
          - ONAY
        default: KONTROL
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p test_tractor_forum_local_m2m100.py
  synthetic:
    if: github.event_name == 'workflow_dispatch' && inputs.onay == 'ONAY' && github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.56.1 sentencepiece==0.2.1
      - name: Run synthetic fixture for all nine targets
        run: |
          python -c 'import json,hashlib,pathlib; s="Traktör 2026 yılında Türkiye fabrikasında üretildi."; pathlib.Path("/tmp/m2m-source.json").write_text(json.dumps({"source_locale":"tr","source_hash":hashlib.sha256(s.encode()).hexdigest(),"segments":[{"id":"synthetic","text":s}]}))'
          python scripts/tractor_forum_local_m2m100.py --input /tmp/m2m-source.json --output /tmp/m2m-reference.json --locales en zh hi pt-br fr de ru ja es --download
          python -c 'import json; d=json.load(open("/tmp/m2m-reference.json")); assert len(d["locales"])==9 and d["status"]=="reference_only_not_approved"; print("9 synthetic target references generated; not semantic approval")'
