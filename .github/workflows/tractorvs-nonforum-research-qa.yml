name: TractorVS non-forum research UX production QA

on:
  pull_request:
    paths:
      - "site/src/components/HomeExperience.astro"
      - "site/src/components/TractorPhoto.astro"
      - "site/src/styles/home-experience.css"
      - "site/src/lib/editorial-discovery-i18n.mjs"
      - "site/src/components/TractorDetail.astro"
      - "site/src/components/FarmAdvisor.astro"
      - "site/src/components/EditorialHub.astro"
      - "site/e2e-live/tractorvs-research.spec.mjs"
      - ".github/workflows/tractorvs-nonforum-research-qa.yml"
  push:
    branches: [main]
    paths:
      - "site/src/components/HomeExperience.astro"
      - "site/src/components/TractorPhoto.astro"
      - "site/src/styles/home-experience.css"
      - "site/src/lib/editorial-discovery-i18n.mjs"
      - "site/src/components/TractorDetail.astro"
      - "site/src/components/FarmAdvisor.astro"
      - "site/src/components/EditorialHub.astro"
      - "site/e2e-live/tractorvs-research.spec.mjs"
      - "site/playwright.research.config.mjs"
      - ".github/workflows/tractorvs-nonforum-research-qa.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 3"

permissions:
  contents: read

concurrency:
  group: tractorvs-nonforum-research-qa
  cancel-in-progress: false

jobs:
  production-research-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      RESEARCH_QA_PREDEPLOY: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      # Cloudflare deploys in parallel to Actions. Never claim actual site
      # interaction unless every changed public route reflects this release.
      - name: Await verified production research UI (bounded)
        if: github.event_name == 'push'
        run: |
          matched=0
          for attempt in $(seq 1 15); do
            if curl --max-time 20 --silent --show-error --fail --location \
                -o /tmp/tractorvs-home-research.html https://tractorvs.com/tr/ &&
              grep -Fq 'data-research-gallery="licensed"' /tmp/tractorvs-home-research.html &&
              curl --max-time 20 --silent --show-error --fail --location \
                -o /tmp/tractorvs-articles-research.html https://tractorvs.com/tr/articles/ &&
              grep -Fq 'data-research-articles="published"' /tmp/tractorvs-articles-research.html &&
              curl --max-time 20 --silent --show-error --fail --location \
                -o /tmp/tractorvs-advisor-research.html https://tractorvs.com/tr/farm-advisor/ &&
              grep -Fq 'data-research-advisor="steps"' /tmp/tractorvs-advisor-research.html; then
              matched=1
              break
            fi
            sleep 20
          done
          if [ "$matched" != 1 ]; then
            echo "::error::No independent proof that the actual Cloudflare release reached all non-forum research pages."
            exit 1
          fi
      - name: Install locked project and pinned QA tools
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.65.1
      - name: Install desktop and mobile browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify all ten languages using real public research journeys
        run: npx playwright test --config site/playwright.research.config.mjs
      - name: Preserve screenshots and traces on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-nonforum-research-browser-evidence
          path: |
            site/playwright-research-report
            site/test-results-research
          if-no-files-found: ignore
          retention-days: 7
