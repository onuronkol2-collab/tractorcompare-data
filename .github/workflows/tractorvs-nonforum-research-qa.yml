name: TractorVS non-forum research UX production QA

on:
  pull_request:
    paths:
      # Owner release requires this inventory for every site source change.
      - "site/src/**"
      - "site/src/components/HomeExperience.astro"
      - "site/src/components/TractorPhoto.astro"
      - "site/src/styles/home-experience.css"
      - "site/src/lib/editorial-discovery-i18n.mjs"
      - "site/src/components/TractorDetail.astro"
      - "site/src/components/FarmAdvisor.astro"
      - "site/src/components/EditorialHub.astro"
      - "site/e2e-live/tractorvs-research.spec.mjs"
      - "site/scripts/verify-research-qa-report.mjs"
      - "site/tests/research-qa-report.test.mjs"
      - "site/playwright.research.config.mjs"
      - ".github/workflows/tractorvs-nonforum-research-qa.yml"
  push:
    branches: [main]
    paths:
      - "site/src/components/HomeExperience.astro"
      - "site/src/components/TractorPhoto.astro"
      - "site/src/styles/home-experience.css"
      - "site/src/lib/editorial-discovery-i18n.mjs"
      - "site/src/components/TractorDetail.astro"
      - "site/src/components/FarmAdvisor.astro"
      - "site/src/components/EditorialHub.astro"
      - "site/e2e-live/tractorvs-research.spec.mjs"
      - "site/scripts/verify-research-qa-report.mjs"
      - "site/tests/research-qa-report.test.mjs"
      - "site/playwright.research.config.mjs"
      - ".github/workflows/tractorvs-nonforum-research-qa.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 3"

permissions:
  contents: read

concurrency:
  # PR inventory is isolated from real production QA; only a superseded
  # inventory for the same PR may be cancelled. Live requests stay serialized.
  group: tractorvs-nonforum-research-qa-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-research-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      RESEARCH_QA_PREDEPLOY: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      # Cloudflare deploys in parallel to Actions. Never claim actual site
      # interaction unless every changed public route reflects this release.
      - name: Await verified production research UI (bounded)
        if: github.event_name == 'push'
        run: |
          matched=0
          for attempt in $(seq 1 15); do
            if curl --max-time 20 --silent --show-error --fail --location \
                -o /tmp/tractorvs-home-research.html https://tractorvs.com/tr/ &&
              grep -Fq 'data-research-gallery="licensed"' /tmp/tractorvs-home-research.html &&
              curl --max-time 20 --silent --show-error --fail --location \
                -o /tmp/tractorvs-articles-research.html https://tractorvs.com/tr/articles/ &&
              grep -Fq 'data-research-articles="published"' /tmp/tractorvs-articles-research.html &&
              curl --max-time 20 --silent --show-error --fail --location \
                -o /tmp/tractorvs-advisor-research.html https://tractorvs.com/tr/farm-advisor/ &&
              grep -Fq 'data-research-advisor="steps"' /tmp/tractorvs-advisor-research.html; then
              matched=1
              break
            fi
            sleep 20
          done
          if [ "$matched" != 1 ]; then
            echo "::error::No independent proof that the actual Cloudflare release reached all non-forum research pages."
            exit 1
          fi
      - name: Install locked project and pinned QA tools
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm install --prefer-offline --no-save --package-lock=false --ignore-scripts @playwright/test@1.65.1
      - name: Test execution evidence gate (offline)
        run: node --test site/tests/research-qa-report.test.mjs
      - name: List predeployment test inventory (not a live UX pass)
        if: github.event_name == 'pull_request'
        run: |
          npx playwright test --config site/playwright.research.config.mjs --list --reporter=list
          echo '### Predeployment: test inventory only; no live UX execution. Production evidence is required after merge.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install desktop and mobile browser engines
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify all ten languages using real public research journeys
        if: github.event_name != 'pull_request'
        env:
          RESEARCH_QA_JSON_REPORT: ${{ github.workspace }}/site/playwright-research-evidence.json
        run: npx playwright test --config site/playwright.research.config.mjs
      - name: Require actual passing evidence for every language and browser
        if: github.event_name != 'pull_request'
        run: |
          node site/scripts/verify-research-qa-report.mjs site/playwright-research-evidence.json
          echo '### Production: all 40 required language/browser journeys executed and passed; no skipped or flaky tests.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve screenshots and traces on failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tractorvs-nonforum-research-browser-evidence
          path: |
            site/playwright-research-report
            site/test-results-research
            site/playwright-research-evidence.json
          if-no-files-found: ignore
          retention-days: 7
