name: TractorVS production bundle safety check (no deploy)

on:
  pull_request:
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "site/package-lock.json"
      - "wrangler.jsonc"
      - "scripts/tractor-publication-autosync.mjs"
      - ".github/workflows/tractorvs-production-release-check.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "site/package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/tractorvs-production-release-check.yml"
  workflow_dispatch:

# Superseded PR revisions must not occupy runners needed by the current batch.
# Keep push, scheduled and manually dispatched checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify_production:
    # GitHub withholds Actions secrets from Dependabot PRs, including same-repo PRs.
    # Do not grant secrets to Dependabot or forks. Secretless site build tests
    # run separately; a skipped production build must never be reported as passed.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        id: node_setup
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Report npm download cache status
        env:
          CACHE_HIT: ${{ steps.node_setup.outputs.cache-hit }}
        run: |
          printf 'npm download cache hit: %s\n' "${CACHE_HIT:-unknown}" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate production release gate and Worker configuration parity
        run: node site/scripts/verify-cloudflare-build-contract.mjs

      - name: Install declared workspace dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify exactly the Cloudflare production bundle, without deploying
        working-directory: site
        env:
          SITE_URL: https://tractorvs.com
          PUBLIC_INDEXING_ENABLED: "true"
          SUPABASE_URL: https://aaufxtcvnzgavtlintiv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          WORKERS_CI_BRANCH: main
          TRACTORVS_BUILD_PROFILE: "true"
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Read-only TRACTORVS_SUPABASE_ANON_JWT secret missing"; exit 1
          fi
          npm run build:production
          node scripts/verify-brand-discovery-pilot.mjs
          node scripts/verify-manufacturer-conflicts.mjs
      - name: Test Worker bundling without deploying
        working-directory: site
        run: npx wrangler deploy --dry-run --outdir ../.wrangler-production-audit
