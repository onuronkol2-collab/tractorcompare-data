name: TractorVS verified release readiness (staged)
# Trusted base-only workflow: never check out or execute PR code.
# This status is NOT required until direct-main writers are migrated and
# an owner validates the full release ruleset. No automatic merge here.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - "site/src/**"
  workflow_run:
    workflows:
      - 'TractorVS Golden Rule integrity'
      - 'Site build validation'
      - 'TractorVS production bundle safety check (no deploy)'
      - 'TractorVS evidence-based sitemap lastmod ledger'
      - 'TractorVS browser smoke and accessibility baseline'
      - 'TractorVS non-forum research UX production QA'
      - 'TractorVS catalog SSR reachability and mobile HTML budget'
      - 'CodeQL'
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Same-repository pull request number"
        type: string
        required: true
permissions: {}
concurrency:
  group: tractorvs-readiness-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  # Preserve the bounded evaluator when an early completion event arrives.
  cancel-in-progress: false
jobs:
  readiness:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository || github.event_name == 'check_run' && github.event.check_run.app.slug == 'cloudflare-workers-and-pages')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted event checkout
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f scripts/tractorvs-release-readiness.mjs
          test -f scripts/tractorvs-release-readiness-policy.mjs
      - name: Evaluate exact current SHA from trusted base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tractorvs-release-readiness.mjs
