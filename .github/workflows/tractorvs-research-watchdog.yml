name: TractorVS free-first research watchdog

# Free-first research health check. Scheduled calls are read-only and never spend Gemini tokens.
# GitHub Actions cron can be delayed under load; not a real-time guarantee.
on:
  schedule:
    - cron: '11,41 * * * *'
  # Initial PR merge bootstraps the watcher once; future runs use the schedule.
  push:
    branches: [main]
    paths:
      - ".github/workflows/tractorvs-research-watchdog.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (default): queue/budget check only. Disable ONLY for explicit bounded paid fallback"
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: tractorvs-research-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run tests before first automated dispatch
        run: node --test scripts/tractor-research-budget.test.mjs scripts/tractor-research-watchdog.test.mjs
      - name: Free-first check research queue and budget; paid fallback only with explicit manual opt-in
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACTORVS_SUPABASE_ANON_JWT: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          TRACTORVS_QUEUE_SECRET: ${{ secrets.TRACTORVS_QUEUE_SECRET }}
          # Default for scheduled/push runs: read-only; user must explicitly disable dry_run in manual dispatch.
          TRACTORVS_DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == true }}
        run: node scripts/tractor-research-watchdog.mjs
