name: TractorVS licensed Commons JPEG review staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tractorvs-reviewed-commons-media-staging
  cancel-in-progress: false
jobs:
  generate_unpublished_review_artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generator syntax without network
        run: python -m py_compile site/scripts/stage-reviewed-commons-20261122.py
      - name: Install pinned JPEG decoder
        run: python -m pip install --quiet 'Pillow==11.3.0'
      - name: Fetch exactly three reviewed Commons images without automatic 429 retries
        run: python site/scripts/stage-reviewed-commons-20261122.py --output-dir ./photo-derivatives-review
      - name: Verify nine JPEG derivatives and SHA-256 hashes before packaging
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image
          folder = Path("photo-derivatives-review")
          ledger = json.loads((folder / "sha256-ledger.json").read_text())
          assert ledger["reviewRequired"] is True
          assert ledger["publicationCount"] == 0
          assert len(ledger["images"]) == 3
          for item in ledger["images"]:
              assert len(item["derivatives"]) == 3
              assert {d["width"] for d in item["derivatives"]} == {480, 960, 1920}
              for d in item["derivatives"]:
                  f = folder / d["file"]
                  assert f.parent == folder
                  raw = f.read_bytes()
                  assert len(raw) == d["bytes"]
                  assert hashlib.sha256(raw).hexdigest() == d["sha256"]
                  with Image.open(f) as im:
                      im.load()
                      assert im.format == "JPEG"
                      assert (im.width, im.height) == (d["width"], d["height"])
          print("TRACTORVS_REVIEW_ONLY_NINE_JPEGS_SHA256_OK")
          PY
      - name: Upload nonpublishing evidence and JPEGs for independent review
        uses: actions/upload-artifact@v4
        with:
          name: tractorvs-steyr-zetor-licensed-jpegs-review-only
          path: photo-derivatives-review/
          if-no-files-found: error
          retention-days: 30
