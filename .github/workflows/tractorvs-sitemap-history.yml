name: TractorVS evidence-based sitemap lastmod ledger

# Runs on published content changes and daily, never stamps the entire site
# with a build timestamp. First run records content hashes without dates.
on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        required: true
        description: "Build and compare only; do not commit provenance history"
  push:
    branches: [main]
    paths:
      # Shared catalogue, metadata, translations, routes and styles can all
      # change the significant HTML digest, even without editing TractorDetail.
      - "site/src/**"
      - "!site/src/data/sitemap-lastmod.json"
      - "site/public/**"
      - "site/astro.config.mjs"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/scripts/production-release-gate.mjs"
      - "site/scripts/verify-*.mjs"
      - "scripts/tractor-sitemap-history.mjs"
      - "scripts/tractor-sitemap-history.test.mjs"
      - ".github/workflows/tractorvs-sitemap-history.yml"
  pull_request:
    paths:
      # Ledger-only candidates must run the independent read-only preview.
      - "site/src/**"
      - "seo/sitemap-content-history.json"
      - "scripts/tractorvs-publication-candidate.mjs"
      - "site/tests/publication-candidate.test.mjs"
      - "site/public/**"
      - "site/astro.config.mjs"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/scripts/production-release-gate.mjs"
      - "site/scripts/verify-*.mjs"
      - "scripts/tractor-sitemap-history.mjs"
      - "scripts/tractor-sitemap-history.test.mjs"
      - ".github/workflows/tractorvs-sitemap-history.yml"

concurrency:
  # Read-only PRs have no shared writes; keep main's single writer serialized.
  group: ${{ github.event_name == 'pull_request' && format('tractorvs-sitemap-history-pr-{0}', github.event.pull_request.number) || 'tractorvs-sitemap-history-main' }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Test evidence-only lastmod change detection and fail-closed policies
        run: node --test scripts/tractor-sitemap-history.test.mjs

  preview_reconcile:
    # Reproduce production HTML and the persisted sitemap hash checkpoint on
    # trusted pull requests, BEFORE merging. Local writes are never committed
    # or pushed from this job, and untrusted forks receive no DB secret.
    needs: tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned Astro production dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build actual published catalogue without deployment
        working-directory: site
        env:
          SITE_URL: https://tractorvs.com
          PUBLIC_INDEXING_ENABLED: "true"
          WORKERS_CI_BRANCH: main
          SUPABASE_URL: https://aaufxtcvnzgavtlintiv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          MIN_PUBLIC_TRACTOR_PAGES: "100"
        run: npm run build:production
      - name: Determine whether legacy digest migration is required
        id: digest_migration
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const h=JSON.parse(readFileSync("seo/sitemap-content-history.json","utf8")); console.log("required="+(!h.digestAlgorithm&&Object.keys(h.pages).length>0))' >> "$GITHUB_OUTPUT"
      - name: Reconstruct exact reviewed historical checkpoint for one-time migration
        if: steps.digest_migration.outputs.required == 'true'
        uses: actions/checkout@v4
        with:
          ref: c86bc0f39906d53e1e3805f724185fb1b3ace767
          path: sitemap-legacy-checkpoint
          persist-credentials: false
      - name: Scope disposable historical build to prior published model identities
        if: steps.digest_migration.outputs.required == 'true'
        run: node scripts/tractor-sitemap-history.mjs --prepare-historical-catalog
      - name: Build historical checkpoint using anonymous RLS catalogue
        if: steps.digest_migration.outputs.required == 'true'
        working-directory: sitemap-legacy-checkpoint/site
        env:
          SITE_URL: https://tractorvs.com
          PUBLIC_INDEXING_ENABLED: "true"
          WORKERS_CI_BRANCH: main
          SUPABASE_URL: https://aaufxtcvnzgavtlintiv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          MIN_PUBLIC_TRACTOR_PAGES: "100"
        run: |
          npm ci --no-audit --no-fund
          npm run build:production
          echo "SITEMAP_LEGACY_DIST=$GITHUB_WORKSPACE/sitemap-legacy-checkpoint/site/dist" >> "$GITHUB_ENV"
      - name: Validate unchanged lastmod plus genuine significant HTML changes
        run: node scripts/tractor-sitemap-history.mjs
      - name: Rebuild and verify full production sitemap with provenance dates
        working-directory: site
        env:
          SITE_URL: https://tractorvs.com
          PUBLIC_INDEXING_ENABLED: "true"
          WORKERS_CI_BRANCH: main
          SUPABASE_URL: https://aaufxtcvnzgavtlintiv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          MIN_PUBLIC_TRACTOR_PAGES: "100"
        run: npm run build:production
      - name: Verify rebuilt HTML and emitted dates against candidate checkpoint
        run: node scripts/tractor-sitemap-history.mjs --verify-rebuilt-checkpoint
      - name: Reject a repaired submitted ledger in candidate preview
        if: startsWith(github.event.pull_request.head.ref, 'ops/publication-candidate/sitemap/')
        run: git diff --exit-code HEAD -- seo/sitemap-content-history.json site/src/data/sitemap-lastmod.json
      - name: Keep PR preview read-only
        run: |
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${GITHUB_REF}" != "refs/heads/main"
          echo "Provenance writes exist only in this ephemeral runner; no commit or push is configured."

  build_and_reconcile:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned Astro production dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build exact published catalogue using anonymous RLS view
        working-directory: site
        env:
          SITE_URL: https://tractorvs.com
          PUBLIC_INDEXING_ENABLED: "true"
          WORKERS_CI_BRANCH: main
          SUPABASE_URL: https://aaufxtcvnzgavtlintiv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          MIN_PUBLIC_TRACTOR_PAGES: "100"
        run: npm run build:production
      - name: Determine whether legacy digest migration is required
        id: digest_migration
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const h=JSON.parse(readFileSync("seo/sitemap-content-history.json","utf8")); console.log("required="+(!h.digestAlgorithm&&Object.keys(h.pages).length>0))' >> "$GITHUB_OUTPUT"
      - name: Reconstruct exact reviewed historical checkpoint for one-time migration
        if: steps.digest_migration.outputs.required == 'true'
        uses: actions/checkout@v4
        with:
          ref: c86bc0f39906d53e1e3805f724185fb1b3ace767
          path: sitemap-legacy-checkpoint
          persist-credentials: false
      - name: Scope disposable historical build to prior published model identities
        if: steps.digest_migration.outputs.required == 'true'
        run: node scripts/tractor-sitemap-history.mjs --prepare-historical-catalog
      - name: Build historical checkpoint using anonymous RLS catalogue
        if: steps.digest_migration.outputs.required == 'true'
        working-directory: sitemap-legacy-checkpoint/site
        env:
          SITE_URL: https://tractorvs.com
          PUBLIC_INDEXING_ENABLED: "true"
          WORKERS_CI_BRANCH: main
          SUPABASE_URL: https://aaufxtcvnzgavtlintiv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          MIN_PUBLIC_TRACTOR_PAGES: "100"
        run: |
          npm ci --no-audit --no-fund
          npm run build:production
          echo "SITEMAP_LEGACY_DIST=$GITHUB_WORKSPACE/sitemap-legacy-checkpoint/site/dist" >> "$GITHUB_ENV"
      - name: Inspect rendered HTML and update only changed page timestamps
        run: node scripts/tractor-sitemap-history.mjs
      - name: Rebuild and verify full production sitemap with provenance dates
        working-directory: site
        env:
          SITE_URL: https://tractorvs.com
          PUBLIC_INDEXING_ENABLED: "true"
          WORKERS_CI_BRANCH: main
          SUPABASE_URL: https://aaufxtcvnzgavtlintiv.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.TRACTORVS_SUPABASE_ANON_JWT }}
          MIN_PUBLIC_TRACTOR_PAGES: "100"
        run: npm run build:production
      - name: Verify rebuilt HTML and emitted dates against candidate checkpoint
        run: node scripts/tractor-sitemap-history.mjs --verify-rebuilt-checkpoint
      - name: Plan exact-file sitemap PR candidate (manual dry run only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          if git diff --quiet -- seo/sitemap-content-history.json site/src/data/sitemap-lastmod.json; then
            echo "No changed sitemap candidate."
          else
            node --input-type=module <<'NODE'
            import {readFileSync} from "node:fs";
            import {openPublicationCandidate} from "./scripts/tractorvs-publication-candidate.mjs";
            const files=["seo/sitemap-content-history.json","site/src/data/sitemap-lastmod.json"].map(path=>({path,content:readFileSync(path,"utf8")}));
            const result=await openPublicationCandidate({repo:process.env.GITHUB_REPOSITORY,ref:process.env.GITHUB_REF,baseSha:process.env.GITHUB_SHA,kind:"sitemap",files,dryRun:true});
            console.log("Candidate plan only:",result.branch,result.digest);
            NODE
          fi
      - name: Commit only an audited, real content change checkpoint
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUDITED_BASE="$(git rev-parse HEAD)"
          git add site/src/data/sitemap-lastmod.json seo/sitemap-content-history.json
          if git diff --cached --quiet; then
            echo "No content modification or baseline change; no commit."
          else
            git commit -m "chore(seo): update content-verified sitemap lastmod ledger"
            # Other independent TractorVS publishing jobs can push to main
            # while this build runs. Retry fast-forward safely; NEVER force-push
            # or rebase stale content over a changed published site.
            for attempt in 1 2 3; do
              git fetch origin main
              # A failed comparison must never be mistaken for no changes.
              if ! changed_paths="$(git diff --name-only "$AUDITED_BASE" origin/main)"; then
                echo "::error::Could not compare audited revision with main; refusing stale provenance write."
                exit 1
              fi
              if printf '%s\n' "$changed_paths" |
                grep -Eq '^(site/(src/|public/|scripts/|astro\.config\.mjs$|package(-lock)?\.json$)|scripts/tractor-sitemap-history(\.test)?\.mjs$|seo/sitemap-content-history\.json$|\.github/workflows/tractorvs-sitemap-history\.yml$)'; then
                echo "::error::Public-site input changed during sitemap audit; refusing to record stale lastmod. A scheduled run will rebuild from the new source."
                exit 1
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Concurrent SEO history edit conflicted; no force push."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Audited sitemap history committed successfully."
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "::error::Main branch moved repeatedly; keeping original production content safe."
            exit 1
          fi
      - name: Evidence note
        if: always()
        run: |
          echo "## Sitemap lastmod provenance" >> "$GITHUB_STEP_SUMMARY"
          echo "Dates are added ONLY to pages that changed after a previously audited rendered HTML checkpoint." >> "$GITHUB_STEP_SUMMARY"
          echo "Unchanged pages preserve previous dates; old pages with unknown modification dates remain without lastmod." >> "$GITHUB_STEP_SUMMARY"
          echo "A GitHub commit is not proof of Cloudflare deployment or search indexing." >> "$GITHUB_STEP_SUMMARY"
