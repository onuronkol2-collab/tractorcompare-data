name: TractorVS synthetic TTFB route and edge monitor

on:
  pull_request:
    paths:
      - ".github/workflows/tractorvs-ttfb-route-monitor.yml"
      - "site/scripts/ttfb-route-monitor.mjs"
      - "site/tests/ttfb-route-monitor.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tractorvs-ttfb-route-monitor.yml"
      - "site/scripts/ttfb-route-monitor.mjs"
      - "site/tests/ttfb-route-monitor.test.mjs"
  workflow_dispatch:
  # Daily, outside the busy existing SEO and Lighthouse audit windows.
  schedule:
    - cron: "27 7 * * *"

permissions:
  contents: read

concurrency:
  group: tractorvs-ttfb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'onuronkol2-collab/tractorcompare-data'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Verify route coverage, time buckets, failure and redirect handling offline
        run: node --test site/tests/ttfb-route-monitor.test.mjs
      - name: Sample live anonymous public routes from the runner
        if: github.event_name != 'pull_request'
        run: node site/scripts/ttfb-route-monitor.mjs
      - name: Attach detailed headers-to-response timing without visitor data
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tractorvs-synthetic-ttfb-report
          path: site/ttfb-synthetic-report.json
          if-no-files-found: warn
          retention-days: 14
